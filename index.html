// Chances de retour estimées : on rejoue la planète sur d'autres seeds que celle de la vraie mission (le résultat réel reste secret)
const cacheEstimation=new Map();
function estimerSurvie(p,j,nForce){
  const n=nForce||EPREUVES.estimationMissions;
  const cle=n+'|'+p.seed+'|'+(p.zone||'')+(p.carto?'c':'')+'|'+j.classe+JSON.stringify(j.stats)+j.talents.join()+(j.ceinture||[]).join()+SLOTS.map(s=>{const o=j.equipement[s.id];return o?o.id+o.niveau:'-'}).join();
  if(!cacheEstimation.has(cle)){
    let vivants=0;const causes={};
    for(let i=0;i<n;i++){const r=simuler(p,j,'ESTIM/'+p.seed+'/'+i);if(r.survie)vivants++;else causes[r.causeMort]=(causes[r.causeMort]||0)+1}
    const top=Object.entries(causes).sort((a,b)=>b[1]-a[1])[0];
    if(cacheEstimation.size>200)cacheEstimation.clear();
    cacheEstimation.set(cle,{survie:Math.round(vivants/n*100),tueur:top?ETAPES_NOMS[top[0]]:null});
  }
  return cacheEstimation.get(cle);
}
function blocEstimation(p,j){
  if(!EPREUVES.estimationMissions)return '';
  const e=estimerSurvie(p,j), coul=e.survie>=85?'var(--bon)':e.survie>=60?'var(--ia)':e.survie>=35?'var(--mauvais)':'var(--mort)';
  const coef=EPREUVES.atterrissageRequis[p.classe]||0, s=statsEffectives(j);
  const verdict=e.survie>=85?'Mission de routine. Probablement.':e.survie>=60?'Risque raisonnable, selon nos critères.':e.survie>=35?'La Corp vous conseille de relire le contrat.':'La Corp prépare déjà la lettre de condoléances.';
  return `<div class="estimation" style="--coul:${coul}"><div><span>Chances de retour estimées pour ${j.nom}</span><b>${e.survie} %</b></div>
    <p class="note">${verdict}${e.tueur&&e.survie<95?` Principal danger : ${e.tueur.toLowerCase()}.`:''}${coef?` Atterrissage hostile : endurance ${Math.round(niveauBase(p.danger)*coef)} conseillée (${j.nom} : ${s.endurance}).`:''}${ecartBrut(p,j)>0?` Planète ${p.classe} pour un Jimee ${j.classe} : chaque échec est environ ${facteurEcart(ecartEffectif(p,j)).toFixed(1).replace('.',',')} fois plus mortel.`:''} Estimation de la Corp sur ${EPREUVES.estimationMissions} simulations, l'équipement compte.</p></div>`;
}

// Filtres de la soute (armurerie) : type d'emplacement, niveau minimum, classe (rareté) minimum, tri
const FILTRE_SOUTE_DEFAUT={type:'tous',niveau:1,classe:'C',tri:'recent'};
let filtreSoute={...FILTRE_SOUTE_DEFAUT};
const TYPES_FILTRE=[{id:'tous',nom:'Tout'},{id:'tete',nom:'Tête'},{id:'buste',nom:'Buste'},{id:'bras',nom:'Bras'},{id:'jambes',nom:'Jambes'},{id:'sacs',nom:'Sacs'}];
const RANG_RARETE={C:1,B:2,A:3,S:4,SS:5,SSS:6,L:7};
const correspondType=(o,type)=>type==='tous'||(type==='sacs'?o.emplacement.startsWith('sac'):o.emplacement===type);
// E11 : comparateur — estimation rapide avec l'objet équipé à la place de l'actuel (bras : à la place du moins bon)
function blocComparaison(j,o,p){
  const slots=SLOTS.filter(s=>s.accepte===o.emplacement);if(!slots.length)return '';
  const slot=slots.length>1?slots.reduce((a,b)=>((j.equipement[a.id]||{bonus:-1}).bonus<=(j.equipement[b.id]||{bonus:-1}).bonus?a:b)):slots[0];
  const avant=estimerSurvie(p,j,80).survie,clone={...j,equipement:{...j.equipement,[slot.id]:o}},apres=estimerSurvie(p,clone,80).survie,d=apres-avant;
  return `<p class="comparaison" style="color:${d>0?'var(--bon)':d<0?'var(--mauvais)':'var(--doux)'}">↳ ${avant} % → ${apres} % (${d>0?'+':''}${d} pts)</p>`;
}
function souteFiltree(){
  const f=filtreSoute;
  const l=etat.inventaire.map((o,i)=>({o,i})).filter(({o})=>correspondType(o,f.type)&&o.niveau>=f.niveau&&RANG_RARETE[o.rarete]>=RANG_RARETE[f.classe]);
  if(f.tri==='recent')l.sort((a,b)=>b.i-a.i);
  else if(f.tri==='niveau')l.sort((a,b)=>b.o.niveau-a.o.niveau||RANG_RARETE[b.o.rarete]-RANG_RARETE[a.o.rarete]||b.i-a.i);
  else if(f.tri==='classe')l.sort((a,b)=>RANG_RARETE[b.o.rarete]-RANG_RARETE[a.o.rarete]||b.o.niveau-a.o.niveau||b.i-a.i);
  return l.map(x=>x.o);
}
function filtresSoute(nbAffiches){
  const f=filtreSoute,actif=JSON.stringify(f)!==JSON.stringify(FILTRE_SOUTE_DEFAUT);
  const opt=(val,txt,cur)=>`<option value="${val}" ${String(cur)===String(val)?'selected':''}>${txt}</option>`;
  return `<div class="filtres-soute">
    <div class="puces-filtre">${TYPES_FILTRE.map(t=>{const n=etat.inventaire.filter(o=>correspondType(o,t.id)).length;
      return `<button type="button" data-filtre-type="${t.id}" aria-pressed="${f.type===t.id}">${t.nom} <small>${n}</small></button>`}).join('')}</div>
    <div class="selects-filtre">
      <label>Niveau<select data-filtre="niveau">${Array.from({length:CONFIG.niveauMaxObjet},(_,i)=>opt(i+1,i?`${i+1} et +`:'Tous',f.niveau)).join('')}</select></label>
      <label>Classe<select data-filtre="classe">${opt('C','Toutes',f.classe)}${opt('B','B et +',f.classe)}${opt('A','A et +',f.classe)}${opt('S','S et +',f.classe)}${opt('SS','SS et +',f.classe)}${opt('SSS','SSS et +',f.classe)}</select></label>
      <label>Tri<select data-filtre="tri">${opt('recent','Récents',f.tri)}${opt('niveau','Niveau',f.tri)}${opt('classe','Classe',f.tri)}</select></label>
    </div>
    <p class="note">${nbAffiches} objet${nbAffiches>1?'s':''} affiché${nbAffiches>1?'s':''} sur ${etat.inventaire.length}${actif?` · <button type="button" class="lien" data-filtre-reset="1">Réinitialiser</button>`:''}</p>
  </div>`;
}

function ligneObjet(o,boutons){
  return `<div class="objet"><span><span class="rar-${o.rarete}">${o.nom}</span><br><small>${descObjet(o)}</small></span>${boutons?`<span class="actions">${boutons}</span>`:''}</div>`;
}

function panneauJimee(statsSeules){
  const j=etat.jimee;
  if(!j)return `<p class="vide">Aucun Jimee à bord. ${etat.morts?`${etat.morts} Jimee perdu${etat.morts>1?'s':''} jusqu'ici.`:''}</p>
    ${etat.abandons.length?`<p class="avert">Des équipements attendent sur ${etat.abandons.length} planète${etat.abandons.length>1?'s':''}. L'Agence de récupération est à la Jimee's Corp.</p>`:''}
    <button class="btn corp-btn" data-ecran-corp="${etat.abandons.length?'agence':'recrutement'}">${etat.abandons.length?'Aller à l\'Agence de récupération':'Recruter un Jimee'}</button>`;
  const s=statsEffectives(j), nbEq=objetsEquipes(j).length;
  const rg=rangJimee(j),suiv=RANGS.find(x=>x.missions>j.missions),P=PERSONNALITES.find(x=>x.id===j.perso),orig=BIOMES.find(b=>b.id===j.origine);
  const cl=classeDuJimee(j);
  let h=`<div class="tete-jimee"><div class="portrait" style="--c:${cl.couleur}">${dessinJimee(cl,etat.mission?'normal':'heureux')}</div><div><h2>${j.nom}</h2><p class="sous">Jimee classe ${j.classe} · matricule ${j.matricule} · ${j.missions} mission${j.missions>1?'s':''} réussie${j.missions>1?'s':''}</p></div></div>
    <p class="note">Rang <b>${rg.nom}</b>${suiv?` (prochain rang à ${suiv.missions} missions)`:''}${P?` · ${P.nom}`:''}${orig?` · originaire d'un monde ${orig.nom.toLowerCase()} (+1 endurance et perception sur ce biome)`:''}</p>
    ${j.blessures?`<div class="abandon"><b>Infirmerie : ${j.blessures} blessure${j.blessures>1?'s':''} (−${j.blessures} endurance)</b>
      ${etat.mission?'':`<div class="achats"><button class="btn sec" data-action="soigner" ${etat.credits<INFIRMERIE.credits||manquants(INFIRMERIE.ressources).length?'disabled':''}>Soigner : ${INFIRMERIE.credits} cr + ${listeRessources(INFIRMERIE.ressources)}</button>${etat.consommables.trousse>0?`<button class="btn sec" data-action="soigner" data-trousse="1">Utiliser une trousse (${etat.consommables.trousse})</button>`:''}</div>`}</div>`:''}
    <h3>Statistiques</h3>
    ${Object.keys(STATS_NOMS).map(k=>`<div class="stat"><span>${STATS_NOMS[k]}${(j.eveils||[]).includes(k)?' <b class="marque-eveil" title="Éveil : définitif">✦</b>':''}</span><span class="jauge"><i style="width:${Math.min(100,s[k]/12*100)}%"></i></span><span>${s[k]}</span></div>`).join('')}
    <div class="resume-chiffres"><span>Sac <b>${emplacementsSac(j)}</b></span>${j.blessures?`<span>Blessures <b>${j.blessures}</b></span>`:''}<span>Missions <b>${j.missions}</b></span></div>
    <p class="aide">Base ${Object.keys(STATS_NOMS).map(k=>j.stats[k]).join(' / ')} + équipement${j.blessures?` − ${j.blessures} blessure${j.blessures>1?'s':''}`:''} · un emplacement de sac = une ressource empilée jusqu'à ${SAC.tailleStack} unités, ou un objet.</p>
    <p class="aide">Les caractéristiques ne s'achètent pas : seul le vécu d'un Jimee peut l'éveiller (✦, définitif, une fois par caractéristique). ${(j.eveils||[]).length?`Éveils : ${j.eveils.length} / ${Object.keys(STATS_NOMS).length}.`:''} Les conditions sont classées confidentielles par la Corp, qui ne les connaît pas non plus.</p>
    <div class="section"><h3>Talents</h3>
    <div>${j.talents.map(id=>{const t=TALENTS.find(x=>x.id===id);return `<details class="puce-repli ${t.type}"><summary>${t.nom}</summary><div class="corps">${t.desc}</div></details>`}).join('')}</div></div>`;
  if(statsSeules){
    h+=`<p class="note" style="margin-top:14px">Équipement : ${nbEq} slot${nbEq>1?'s':''} occupé${nbEq>1?'s':''} sur ${SLOTS.length}.</p><button class="btn sec" data-armoire="1">Aller à l'armurerie</button>`;
    return h;
  }
  const bloque=!!etat.mission, cible=selection&&galaxie.planetes.find(p=>p.id===selection);let comparer=0;
  h+=`<div class="section"><h3>Équipement <small>${nbEq} / ${SLOTS.length} emplacements</small></h3>
    ${SLOTS.map(sl=>{const o=j.equipement[sl.id];
      return o?`<details class="repli"><summary><span class="rar-${o.rarete}">${o.nom}</span><small>${sl.nom} · niv. ${o.niveau}</small></summary><div class="corps"><p>${descObjet(o)}</p>${bloque?'':`<button class="btn sec" data-retirer="${sl.id}">Retirer</button>`}</div></details>`
             :`<div class="slot vide-slot"><span>${sl.nom}</span><span>—</span><span></span></div>`}).join('')}
    <p class="aide">Tout ce qui est équipé reste sur la planète si ${j.nom} meurt. La soute ne quitte jamais le vaisseau.</p></div>
    ${!bloque&&j.missions>=10?`<button class="btn sec" data-action="retraite">Envoyer ${j.nom} à la retraite (prime ${25*j.missions} cr + un plan)</button>`:''}
        ${Object.keys(setsPortes(j)).length?`<div class="section"><h3>Sets portés <small>${Object.values(setsPortes(j)).reduce((a,b)=>a+b,0)} pièces</small></h3>${Object.entries(setsPortes(j)).map(([id,n])=>{const st=SETS.find(x=>x.id===id);return repli(st.nom,`<p>${n>=2?'✓':'○'} 2 pièces : ${st.texte2}</p><p>${n>=4?'✓':'○'} 4 pièces : ${st.texte4}</p>`,`${n}/4`)}).join('')}</div>`:''}
    <div class="section"><h3>Tenues enregistrées <small>${(etat.tenues||[]).length} / 3</small></h3>
    ${(etat.tenues||[]).map((t,i)=>`<div class="objet"><span>${t.nom}<br><small>${Object.keys(t.ids).length} pièces</small></span>${bloque?'':`<span class="actions"><button data-action="tenue" data-i="${i}">Équiper</button><button data-action="tenue-suppr" data-i="${i}">×</button></span>`}</div>`).join('')}
    ${!bloque&&(etat.tenues||[]).length<3&&nbEq?`<button class="btn sec" data-action="tenue-sauver">Enregistrer la tenue actuelle</button>`:''}
    ${(etat.tenues||[]).length?'':`<p class="vide-section">Aucune tenue enregistrée.</p><p class="aide">Enregistrez jusqu'à 3 tenues (par exemple « Planètes glacées ») pour les remettre en un geste.</p>`}</div>
    <div class="section"><h3>Ceinture <small>${j.ceinture.length} / ${ATELIER.ceintureMax} consommables</small></h3>
    ${j.ceinture.length?j.ceinture.map((id,i)=>`<div class="objet"><span>${CONSOMMABLES[id].nom}<br><small>${CONSOMMABLES[id].desc}</small></span>${bloque?'':`<span class="actions"><button data-action="deposer" data-i="${i}">Retirer</button></span>`}</div>`).join(''):`<p class="vide-section">Vide. Les consommables se fabriquent à l'atelier.</p>`}
    ${!bloque&&j.ceinture.length<ATELIER.ceintureMax?Object.entries(etat.consommables).filter(([,q])=>q>0).map(([id,q])=>`<div class="objet"><span>${CONSOMMABLES[id].nom} <small>(${q} en stock)</small><br><small>${CONSOMMABLES[id].desc}</small></span><span class="actions"><button data-action="emporter" data-conso="${id}">Emporter</button></span></div>`).join(''):''}</div>
    <div class="section"><h3>Soute du vaisseau <small>${etat.inventaire.length} objet${etat.inventaire.length>1?'s':''}</small></h3>
    ${cible&&!bloque&&etat.inventaire.length?`<p class="aide">Comparateur : chances de retour sur ${cible.nom} avec chaque objet à la place de l'actuel.</p>`:''}
    ${etat.inventaire.length?filtresSoute(souteFiltree().length):''}
    ${etat.inventaire.length&&!souteFiltree().length?`<p class="note">Aucun objet ne correspond à ces filtres.</p>`:''}
    ${etat.inventaire.length?souteFiltree().map(o=>{
      let b='';
      if(!bloque){
        if(o.emplacement==='bras')b=`<button data-equiper="${o.id}" data-slot="bras_droit">Bras D</button><button data-equiper="${o.id}" data-slot="bras_gauche">Bras G</button>`;
        else b=`<button data-equiper="${o.id}">Équiper</button>`;
      }
      return ligneObjet(o,b)+(cible&&!bloque&&comparer<12&&(o.stat||o.effet)?(comparer++,blocComparaison(j,o,cible)):'');
    }).join(''):`<p class="vide-section">Vide. Les objets rapportés de mission arrivent ici.</p>`}
    ${bloque?`<p class="note">${j.nom} est en mission : impossible de changer son équipement.</p>`:''}</div>`;
  return h;
}

function panneauRecuperation(){
  const actives=recupsActives(), aLire=etat.recuperations.filter(x=>x.statut==='terminee'&&!x.lu);
  const plein=actives.length>=RECUP.maxSimultanees;
  let h=`<h3>Agence de récupération</h3>
    <p class="aide">Quand un Jimee meurt, tout ce qu'il portait reste sur la planète. Nos équipes peuvent tenter de le rapporter en ${etat.params.test?Math.round(RECUP.dureeTestMs/1000)+' secondes (mode test)':'5 minutes'}. Vous ne choisissez pas les objets : l'équipe prend ce qu'elle trouve.</p>
    <p class="avert">Une seule tentative par Jimee : dès qu'une équipe est engagée, tout ce qu'elle ne rapporte pas est perdu à jamais. Choisissez bien votre agence.</p>`;
  if(!etat.abandons.length&&!actives.length&&!aLire.length)return h+`<p class="note">Aucun équipement abandonné pour le moment. Profitez-en, ça ne durera pas.</p>`+blocEpavesAmis();
  for(const x of actives)h+=`<div class="ligne"><span>🛟 ${x.id} · ${x.nomPlanete} (${agence(x.niveauAgence).nom})</span><span>en cours</span></div>`;
  for(const x of aLire)h+=`<button class="btn sec" data-action="rapport-recup" data-recup="${x.id}">Lire le rapport ${x.id} (${x.nomPlanete})</button>`;
  if(plein)h+=`<p class="note">${RECUP.maxSimultanees} équipes déjà sur le terrain. Nos effectifs sont limités, nos tarifs non.</p>`;
  for(const ab of etat.abandons){
    h+=`<div class="abandon"><div class="abandon-tete"><strong>${ab.nomPlanete}${ab.nomGalaxie?` <small>(${ab.nomGalaxie})</small>`:''}</strong><small>${ab.jimeeNom} · ${ab.objets.length} objet${ab.objets.length>1?'s':''}</small></div>
      <table><tr><th>Objet</th><th>Niv.</th>${RECUP.agences.map(ag=>`<th>Ag. ${ag.niveau}</th>`).join('')}</tr>
      ${ab.objets.map(o=>`<tr><td><span class="rar-${o.rarete}">${o.nom}</span></td><td>${o.niveau}</td>${RECUP.agences.map(ag=>`<td>${chanceObjet(o,ag,ab.bonusBalise||0)} %</td>`).join('')}</tr>`).join('')}</table>
      <p class="note">Chance de rapporter chaque objet s'il est tenté, selon l'agence.</p>
      ${RECUP.agences.map(ag=>{
        const prix=prixAgence(ag,ab.objets), manque=etat.credits<prix;
        return `<div class="agence"><h4>Niveau ${ag.niveau} : ${ag.nom}</h4>
          <p class="pitch">« ${ag.pitch} »</p>
          <p class="chiffres">Retour de l'équipe : <b>${ag.retour} %</b> · bonus par objet : <b>+${ag.bonusObjet} %</b></p>
          <p class="chiffres">Objets tentés : ${ag.tranches.map(t=>`${t.poids} % de chances de tenter ${Math.round(t.part*100)} %`).join(', ')}</p>
          <button class="btn corp-btn" data-action="recuperer" data-abandon="${ab.id}" data-agence="${ag.niveau}" ${manque||plein||(ag.niveau===3&&rangCorp()<REPUTATION.agence3)?'disabled':''}>Engager pour ${prix} cr</button>
          ${ag.niveau===3&&rangCorp()<REPUTATION.agence3?`<p class="note">Réservé au rang ${REPUTATION.rangs[REPUTATION.agence3].nom}.</p>`:''}
          ${manque?`<p class="note">Il vous manque ${prix-etat.credits} crédits.</p>`:''}</div>`}).join('')}
      <button class="btn sec" data-action="laisser" data-abandon="${ab.id}">Laisser sur place définitivement</button></div>`;
  }
  return h+blocEpavesAmis();
}

/* ---------- Marché intergalactique ---------- */
// Infos d'un article dans le mode courant (vendre / acheter) : prix unitaire, quantité maximale, raison si rien n'est possible
function articleMarche(id){
  if(id==='carburant'){
    const cap=reservoir().capacite,place=cap-etat.vaisseau.carburant,p=prixCarburant();
    return {id,nom:'Baril de carburant',sousTitre:`${etat.vaisseau.carburant} / ${cap} dans le réservoir`,prix:p,
      max:p?Math.min(place,Math.floor(etat.credits/p)):place,raison:place<=0?'Réservoir plein.':'Crédits insuffisants.'};
  }
  const x=RES[id];if(!x)return null;
  const stock=etat.ressources[id]||0;
  if(marche.mode==='vendre')return {id,nom:x.nom,rarete:x.rarete,stock,prix:prixVente(id),max:stock,tags:[penurieDuJour()===id?'pénurie × 2':'',demandeLocale(etat.galaxieActuelle).includes(id)?'demande locale × 1,5':'',multMarche(id)<.99?`marché saturé × ${multMarche(id).toFixed(2).replace('.',',')}`:''].filter(Boolean),raison:'Aucune unité en soute. Ramenez-en de mission.'};
  const p=prixAchat(id);
  return {id,nom:x.nom,rarete:x.rarete,stock,prix:p,max:Math.floor(etat.credits/p),raison:`Crédits insuffisants (${p} cr l'unité).`};
}
function textesTransaction(a,q){
  const total=a.prix*q,vendre=marche.mode==='vendre';
  return {recap:`${q} × ${a.prix} cr = <b>${total} cr</b>`,
    apres:`Crédits après l'opération : ${vendre?etat.credits+total:etat.credits-total} cr`,
    bouton:`${vendre?'Vendre':'Acheter'} ${q} × ${a.nom} ${total?`pour ${total} cr`:'(gratuit en phase de test)'}`};
}
function ligneArticle(id){
  const a=articleMarche(id),ouvert=marche.sel===id,vendre=marche.mode==='vendre';
  let h=`<div class="article${ouvert?' ouvert':''}${a.max<=0?' grise':''}">
    <button type="button" class="article-tete" data-marche-sel="${id}" aria-expanded="${ouvert}">
      <span class="icone-res">${iconeRessource(id)}</span>
      <span class="article-nom">${a.nom}<small>${a.rarete?`<span class="res-${a.rarete}">${RARETES_RESSOURCE[a.rarete].nom}</span> · `:''}${a.sousTitre||`${a.stock} en soute`}${(a.tags||[]).length?`<br><span class="tag-marche">${a.tags.join(' · ')}</span>`:''}</small></span>
      <span class="article-prix"><b>${a.prix?a.prix+' cr':'gratuit'}</b><small>${vendre?'rachat':'achat'} / unité</small></span>
    </button>`;
  if(ouvert){
    if(a.max<=0)h+=`<div class="transaction"><p class="note">${a.raison}</p></div>`;
    else{
      const q=marche.qte=Math.max(1,Math.min(marche.qte,a.max)),t=textesTransaction(a,q);
      h+=`<div class="transaction">
        <div class="quantite"><button type="button" data-qte-delta="-1" aria-label="Une de moins">−</button><input type="number" inputmode="numeric" min="1" max="${a.max}" value="${q}" data-marche-qte aria-label="Quantité"><button type="button" data-qte-delta="1" aria-label="Une de plus">+</button></div>
        <div class="raccourcis">${MARCHE.raccourcis.filter(n=>n<a.max).map(n=>`<button type="button" data-qte-set="${n}">${n}</button>`).join('')}<button type="button" data-qte-set="max">Max (${a.max})</button></div>
        <div class="recap"><span id="mq-recap">${t.recap}</span><small id="mq-apres">${t.apres}</small></div>
        <button class="btn" data-action="marche-valider" id="mq-bouton">${t.bouton}</button>
      </div>`;
    }
  }
  return h+'</div>';
}
// Mise à jour en direct pendant la saisie de la quantité (sans redessiner l'écran, pour garder le clavier ouvert)
function majTransaction(){
  const a=articleMarche(marche.sel);if(!a||!$('#mq-recap'))return;
  const t=textesTransaction(a,marche.qte);
  $('#mq-recap').innerHTML=t.recap;$('#mq-apres').textContent=t.apres;$('#mq-bouton').textContent=t.bouton;
}
// Sacs vendus au marché : un objet sac de stockage neuf, livré dans la soute du vaisseau
function acheterSac(i){
  const offre=SAC.boutique[i];if(!offre)return;
  const modele=CATALOGUE.find(m=>m.nom===offre.nom);
  if(!modele||etat.credits<offre.prix)return;
  const r=creerRng('SAC/'+Date.now()+'/'+Math.random()),o=creerObjet(r,modele,offre.niveau,'C');
  etat.credits-=offre.prix;etat.inventaire.push(o);
  dire(`${offre.nom} (niveau ${offre.niveau}) livré dans la soute : +${emplacementsSacNiveau(offre.niveau)} emplacements une fois équipé à l'armurerie. Coutures garanties jusqu'à la sortie du magasin.`);tout();
}
function blocSacsMarche(){
  return `<h3>Sacs</h3><p class="note">Un sac de stockage ajoute des emplacements au sac du Jimee (${SAC.emplacementsBase} de base). Livré dans la soute du vaisseau, à équiper à l'armurerie.</p>`+
    SAC.boutique.map((b,i)=>`<div class="article"><div class="article-tete"><span class="icone-res">${iconeSac(b.niveau)}</span>
      <span class="article-nom">${b.nom}<small>niveau ${b.niveau} · +${emplacementsSacNiveau(b.niveau)} emplacements (${SAC.emplacementsBase+emplacementsSacNiveau(b.niveau)} au total)</small></span>
      <span class="article-prix"><b>${b.prix} cr</b><button class="btn" data-action="acheter-sac" data-sac="${i}" ${etat.credits<b.prix?'disabled':''}>Acheter</button></span></div></div>`).join('');
}
const iconeSac=n=>`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 16 Q24 6 34 16" stroke="#8a5a2b" stroke-width="3" fill="none"/><rect x="9" y="16" width="30" height="26" rx="6" fill="${n>=9?'#6a4fa3':n>=5?'#3d6bd6':'#8a5a2b'}"/><rect x="9" y="16" width="30" height="9" rx="4" fill="rgba(255,255,255,.18)"/><rect x="20" y="28" width="8" height="6" rx="2" fill="#F2C14E"/></svg>`;
/* ---------- Vie du Jimee (lot 3) ---------- */
function soigner(avecTrousse){
  const j=etat.jimee;if(!j||etat.mission||!j.blessures)return;
  if(avecTrousse){if(!(etat.consommables.trousse>0))return;etat.consommables.trousse--;if(!etat.consommables.trousse)delete etat.consommables.trousse}
  else{if(etat.credits<INFIRMERIE.credits||manquants(INFIRMERIE.ressources).length)return;etat.credits-=INFIRMERIE.credits;payer(INFIRMERIE.ressources)}
  j.blessures--;dire(`${j.nom} sort de l'infirmerie avec un pansement de plus et une blessure de moins.`);tout();
}
function retraite(){
  const j=etat.jimee;if(!j||etat.mission||j.missions<10)return;
  if(!confirm(`Envoyer ${j.nom} à la retraite ? Son équipement retourne en soute.`))return;
  const prime=25*j.missions;etat.credits+=prime;
  for(const s of SLOTS)if(j.equipement[s.id]){etat.inventaire.push(j.equipement[s.id]);j.equipement[s.id]=null}
  for(const id of j.ceinture)etat.consommables[id]=(etat.consommables[id]||0)+1;
  const inconnus=RECETTES.filter(x=>!etat.plans.includes(x.id)),plan=inconnus.length?inconnus[Math.floor(Math.random()*inconnus.length)]:null;if(plan)etat.plans.push(plan.id);
  etat.stats.retraites++;verifierSucces();
  etat.memorial.push({type:'retraite',nom:j.nom,classe:j.classe,matricule:j.matricule,missions:j.missions,date:Date.now()});
  etat.jimee=null;dire(`${j.nom} part à la retraite après ${j.missions} missions : prime de ${prime} crédits${plan?` et son plan secret de ${nomProduit(plan)}`:''}. Il ouvre une buvette sur une lune tranquille.`);tout();
}
// E12 : tenues enregistrées (3 au maximum)
function sauverTenue(){const j=etat.jimee;if(!j||etat.mission)return;etat.tenues=etat.tenues||[];if(etat.tenues.length>=3)return;
  const nom=prompt('Nom de la tenue ?',`Tenue ${etat.tenues.length+1}`);if(!nom)return;
  const ids={};for(const s of SLOTS)if(j.equipement[s.id])ids[s.id]=j.equipement[s.id].id;etat.tenues.push({nom:nom.slice(0,30),ids});tout()}
function equiperTenue(i){const j=etat.jimee,t=(etat.tenues||[])[i];if(!j||!t||etat.mission)return;let manque=0;
  for(const s of SLOTS){const id=t.ids[s.id];if(!id)continue;if(j.equipement[s.id]&&j.equipement[s.id].id===id)continue;
    const k=etat.inventaire.findIndex(o=>o.id===id);if(k<0){manque++;continue}
    const o=etat.inventaire.splice(k,1)[0];if(j.equipement[s.id])etat.inventaire.push(j.equipement[s.id]);j.equipement[s.id]=o}
  dire(`Tenue « ${t.nom} » enfilée${manque?` (${manque} pièce${manque>1?'s':''} introuvable${manque>1?'s':''} : perdue, recyclée ou équipée ailleurs)`:''}.`);tout()}
function validerMarche(){
  const a=articleMarche(marche.sel);if(!a||a.max<=0)return;
  const q=Math.max(1,Math.min(marche.qte,a.max));
  if(marche.mode==='vendre')vendreQuantite(a.id,q);
  else if(a.id==='carburant')acheterCarburant(q);
  else acheterRessource(a.id,q);
}
function panneauMarche(){
  const vendre=marche.mode==='vendre',nb=totalRessources(etat.ressources);
  let h=`<h2>Marché intergalactique</h2>
  <p class="sous">Bourse officielle de la Jimee's Corp. Les prix incluent la marge, la taxe, la taxe sur la marge et la marge sur la taxe.</p>
  <div class="marche-resume"><span><b>${etat.credits}</b> crédits</span><span><b>${nb}</b> unité${nb>1?'s':''} en soute · valeur ${valeurRessources(etat.ressources)} cr</span></div>
  <div class="bascule-marche" role="group" aria-label="Type d'opération"><button type="button" data-mode-marche="vendre" aria-pressed="${vendre}">Vendre</button><button type="button" data-mode-marche="acheter" aria-pressed="${!vendre}">Acheter</button></div>
  <p class="note">${vendre?`La Corp rachète vos ressources au prix indiqué. Le marché est vivant : vendre beaucoup d'une ressource fait baisser son prix (il remonte avec le temps). Pénurie du jour : <b>${RES[penurieDuJour()].nom}</b> (× 2). Demande locale dans cette galaxie : ${demandeLocale(etat.galaxieActuelle).map(id=>RES[id].nomMin).join(', ')} (× 1,5).`
    :`Prix d'achat = ${MARCHE.multiplicateurAchat} × le prix de rachat. Pratique pour compléter une amélioration du hangar, ruineux pour tout le reste.`}</p>`;
  for(const [titre,ext] of [['Minerais','mine'],['Récoltes','recolte'],['Faune','faune']])
    h+=`<h3>${titre}</h3>`+RESSOURCES.filter(x=>x.extraction===ext).map(x=>ligneArticle(x.id)).join('');
  if(!vendre)h+=blocSacsMarche()+`<h3>Vaisseau</h3>`+ligneArticle('carburant')+`<p class="note">Prix du carburant : ${prixCarburant()?`${prixCarburant()} cr / unité`:`gratuit pendant la phase de test (${CARBURANT.prixUnite} cr / unité ensuite)`}. Odeur de kérosène offerte.</p>`;
  if(vendre&&nb)h+=`<button class="btn sec" data-action="vendre">Tout vendre (${nb} unités, ${valeurRessources(etat.ressources)} cr)</button>`;
  return h;
}

/* ---------- Hangar : schéma du vaisseau et améliorations ---------- */
function effetPiece(id,n){
  const l=(TABLES_AMELIORATION[id]||[]).find(x=>x.niveau===n);if(!l)return '';
  return id==='reacteur'?(l.facteur<1?`durée des missions −${Math.round((1-l.facteur)*100)} %`:'durée normale'):id==='scanner'?`portée ${l.portee} kAL`:`${l.capacite} unités de carburant`;
}
function gainPiece(id,a,b){
  return id==='reacteur'?`−${Math.round((a.facteur-b.facteur)*100)} % de durée par mission`:id==='scanner'?`+${b.portee-a.portee} kAL`:`+${b.capacite-a.capacite} unités`;
}
// V23 : état d'amélioration d'une pièce, affiché sur les cartes du bas du hangar
function etatPiece(id){
  const c=coutAmelioration(id);
  if(!c)return {cls:'piece-max',txt:'Niveau max'};
  if(peutAmeliorer(id))return {cls:'piece-pret',txt:`▲ Niv. ${c.suivant.niveau} possible`};
  const nb=Object.keys(ressourcesManquantes(id)).length;
  return {cls:'piece-manque',txt:nb?`Niv. ${c.suivant.niveau} · manque ${nb} ress.`:`Niv. ${c.suivant.niveau} · manque des crédits`};
}
function zonesHangar(){
  return PIECES_HANGAR.map(p=>{
    const t=TABLES_AMELIORATION[p.id],n=etat.vaisseau[p.id]||1,pret=!p.bientot&&peutAmeliorer(p.id);
    const etiquette=p.bientot?`${p.court||p.nom} · bientôt`:`${p.nom} · ${n}/${t[t.length-1].niveau}`;
    return `<button type="button" class="hotspot-img zone-piece${p.bientot?' bientot':''}${hangarSel===p.id?' sel':''}${pret?' pret':''}" data-piece="${p.id}" data-hx="${p.hx}" data-hy="${p.hy}" data-hw="${p.hw}" data-hh="${p.hh}" aria-label="${etiquette}${pret?', amélioration possible':''}"><span>${pret?'▲ ':''}${etiquette}</span></button>`;
  }).join('');
}
function ficheHangar(){
  const p=PIECES_HANGAR.find(x=>x.id===hangarSel);
  if(!p)return `<h3>Hangar de maintenance</h3>
    <p class="note">Touchez une pièce du schéma pour voir ses améliorations et les ressources nécessaires. ▲ = amélioration possible maintenant.</p>
    <div class="carbu-resume"><span>Carburant <b>${etat.vaisseau.carburant}</b> / ${reservoir().capacite}</span><button type="button" class="btn" data-action="carburant" data-qte="${reservoir().capacite}" ${etat.vaisseau.carburant>=reservoir().capacite||etat.credits<prixCarburant()*(reservoir().capacite-etat.vaisseau.carburant)?'disabled':''}>${etat.vaisseau.carburant>=reservoir().capacite?'Réservoir plein':`Faire le plein${prixCarburant()?` (${prixCarburant()*(reservoir().capacite-etat.vaisseau.carburant)} cr)`:' (gratuit)'}`}</button></div>
    <div class="resume-pieces">${PIECES_HANGAR.filter(x=>!x.bientot).map(x=>`<button type="button" data-piece="${x.id}" class="${etatPiece(x.id).cls}"><b>${x.nom}</b><small>niv. ${etat.vaisseau[x.id]||1} · ${effetPiece(x.id,etat.vaisseau[x.id]||1)}</small><em>${etatPiece(x.id).txt}</em></button>`).join('')}</div>`;
  const fermer=`<button type="button" class="fermer-fiche" data-piece="aucune" aria-label="Fermer">×</button>`;
  if(p.bientot)return `<div class="fiche-titre"><h3>${p.nom}</h3>${fermer}</div><p class="note">${p.desc}</p><p class="note">Pièce non améliorable pour l'instant : les ingénieurs de la Corp cherchent encore le mode d'emploi.</p>`;
  const t=TABLES_AMELIORATION[p.id],n=etat.vaisseau[p.id]||1,max=t[t.length-1].niveau,actuel=t.find(x=>x.niveau===n),c=coutAmelioration(p.id);
  let h=`<div class="fiche-titre"><h3>${p.nom}</h3>${fermer}</div>
    <p class="niveau-piece">Niveau <b>${n}</b> / ${max} · ${effetPiece(p.id,n)}</p>
    <div class="jauge-niveaux">${t.map(l=>`<i class="${l.niveau<=n?'ok':''}"></i>`).join('')}</div>
    <p class="note">${p.desc}</p>`;
  if(p.id==='reservoir')h+=`<div class="bloc-carbu">${blocCarburant()}</div>`;
  if(p.id==='reacteur')h+=`<p class="aide">S'applique aux missions envoyées après l'amélioration ; une mission en cours garde sa durée.${etat.params.test?' Mode test actif : les missions durent 30 secondes quel que soit le réacteur.':''}</p>`;
  if(!c)return h+`<p class="note">Niveau maximum atteint. La Corp n'a rien de plus gros à vous vendre. Pour l'instant.</p>`+tableNiveaux(p.id,n);
  const manque=ressourcesManquantes(p.id),nbManque=Object.keys(manque).length,cm=coutManquant(p.id);
  const ligneCout=(icone,nom,aVoir,ok)=>`<div class="cout ${ok?'ok':'ko'}"><span class="icone-res">${iconeRessource(icone)}</span><span>${nom}</span><b>${aVoir}</b></div>`;
  h+=`<div class="prochain">Niveau ${c.suivant.niveau} : <b>${effetPiece(p.id,c.suivant.niveau)}</b> <small>(${gainPiece(p.id,actuel,c.suivant)})</small></div>
    <div class="couts">
      ${ligneCout('credits','Crédits',BOUTIQUE_TEST.ameliorationsGratuites?`gratuit en test (${c.suivant.prix} cr ensuite)`:`${etat.credits} / ${c.credits}`,etat.credits>=c.credits)}
      ${Object.entries(c.ressources).map(([id,q])=>ligneCout(id,RES[id].nom,`${etat.ressources[id]||0} / ${q}`,(etat.ressources[id]||0)>=q)).join('')}
      ${BOUTIQUE_TEST.ressourcesAmeliorationsGratuites?`<p class="note">Ressources offertes pendant la phase de test.</p>`:''}
    </div>
    <button class="btn" data-action="ameliorer" data-quoi="${p.id}" ${peutAmeliorer(p.id)?'':'disabled'}>Améliorer au niveau ${c.suivant.niveau}</button>`;
  if(nbManque)h+=`<p class="note">Il manque ${listeRessources(manque)} · ${cm} cr au marché</p>
    <div class="achats"><button class="btn sec" data-action="acheter-manquant" data-quoi="${p.id}" ${etat.credits<cm?'disabled':''}>Acheter ce qui manque (${cm} cr)</button><button class="btn sec" data-marche="acheter">Ouvrir le marché</button></div>`;
  else if(etat.credits<c.credits)h+=`<p class="note">Il manque ${c.credits-etat.credits} crédits.</p>`;
  return h+tableNiveaux(p.id,n);
}
function tableNiveaux(id,n){
  return `<table class="table-niveaux"><tr><th>Niv.</th><th>Effet</th><th>Coût</th></tr>${TABLES_AMELIORATION[id].map(l=>`<tr class="${l.niveau===n?'actuel':''}"><td>${l.niveau}</td><td>${effetPiece(id,l.niveau)}</td><td>${l.prix?`${l.prix} cr${l.ressources?' + '+listeRessources(l.ressources):''}`:'inclus'}</td></tr>`).join('')}</table>`;
}

/* ---------- Atelier : actions ---------- */
const dureeRecette=minutes=>etat.params.test?ATELIER.dureeTestMs:minutes*60*1000*(etat.jimee&&etat.jimee.talents.includes('bricoleur')?.75:1)*(etat.jimee&&porteLeg(etat.jimee,'Gantelet de l\'Architecte')?.5:1);
const manquants=couts=>Object.entries(couts).filter(([id,q])=>(etat.ressources[id]||0)<q).map(([id,q])=>[id,q-(etat.ressources[id]||0)]);
function payer(couts){for(const [id,q] of Object.entries(couts)){etat.ressources[id]-=q;if(etat.ressources[id]<=0)delete etat.ressources[id]}}
function rembourser(couts){for(const [id,q] of Object.entries(couts))etat.ressources[id]=(etat.ressources[id]||0)+q}
// Recale la file : la première tâche garde son horaire si elle est commencée, les suivantes s'enchaînent
function recalerFile(){
  const f=etat.atelier.file,maint=Date.now();let curseur=maint;
  f.forEach((e,i)=>{if(i===0&&e.debut<=maint){curseur=e.fin;return}e.debut=Math.max(curseur,maint);e.fin=e.debut+e.duree;curseur=e.fin});
}
function ajouterTache(t){
  const f=etat.atelier.file,maint=Date.now(),debut=f.length?Math.max(maint,f[f.length-1].fin):maint;
  f.push({...t,debut,fin:debut+t.duree});
}
function fabriquer(id){
  const rc=RECETTE[id];if(!rc||!etat.plans.includes(id))return;
  if(etat.atelier.file.length>=ATELIER.fileMax||manquants(rc.couts).length)return;
  payer(rc.couts);ajouterTache({type:'recette',recette:id,couts:{...rc.couts},duree:dureeRecette(rc.minutes)});
  dire(`${nomProduit(rc)} en fabrication. L'atelier décline toute responsabilité en cas de pièce en trop à la fin.`);tout();
}
function ameliorerObjet(objId){
  const i=etat.inventaire.findIndex(o=>o.id===objId);if(i<0)return;const o=etat.inventaire[i];
  if(!peutEtreAmeliore(o)||etat.atelier.file.length>=ATELIER.fileMax)return;
  const couts=coutAmeliorationObjet(o);if(manquants(couts).length)return;
  payer(couts);etat.inventaire.splice(i,1);
  ajouterTache({type:'amelioration',obj:o,couts,duree:dureeRecette(minutesAmeliorationObjet(o))});
  dire(`${o.nom} part à l'établi pour passer au niveau ${o.niveau+1}. Il reviendra plus fort, ou au moins plus brillant.`);tout();
}
function recyclerObjet(objId){
  const i=etat.inventaire.findIndex(o=>o.id===objId);if(i<0)return;const o=etat.inventaire[i];
  if(!confirm(`Recycler ${o.nom} (niv. ${o.niveau}) ? Il sera détruit.`))return;
  const r=recyclageObjet(o);etat.inventaire.splice(i,1);rembourser(r);
  dire(`${o.nom} démonté : ${listeRessourcesTexte(r)} récupérés. Il restait aussi trois vis, que personne ne sait où remettre.`);tout();
}
function annulerTache(i){
  const t=etat.atelier.file[i];if(!t)return;
  rembourser(t.couts);if(t.obj)etat.inventaire.push(t.obj);
  etat.atelier.file.splice(i,1);recalerFile();
  dire(`Fabrication annulée : ressources remises en soute.`);tout();
}
const peutEtreAmeliore=o=>(o.ameliorations||0)<ATELIER.ameliorationMax&&o.niveau<CONFIG.niveauMaxObjet;
function nomProduit(rc){const p=rc.produit;return p.type==='objet'?`${p.modele} (niv. ${p.niveau})`:p.type==='conso'?`${CONSOMMABLES[p.id].nom} × ${p.q}`:p.type==='carburant'?`${p.q} unités de carburant`:`${p.q} ${RES[p.id].nomMin}`}
// Livraison des tâches terminées (idempotent, appelée chaque seconde et au chargement)
function finaliserAtelier(){
  const f=etat.atelier.file;let fini=0;
  while(f.length&&Date.now()>=f[0].fin){
    const t=f.shift();fini++;
    if(t.type==='amelioration'){const o=t.obj;o.niveau++;o.ameliorations=(o.ameliorations||0)+1;if(o.stat)o.bonus=bonusDeNiveau(o.niveau,o.rarete);etat.inventaire.push(o);dire(`${o.nom} amélioré au niveau ${o.niveau}. Il est dans la soute.`);continue}
    const rc=RECETTE[t.recette],p=rc.produit;
    etat.stats.fabrications++;
    if(p.type==='objet'){const m=CATALOGUE.find(x=>x.nom===p.modele),o=creerObjet(creerRng('FAB/'+t.debut+'/'+rc.id),m,p.niveau,'B');
      const pris=new Set(etat.inventaire.map(x=>x.id));let id=o.id,k=1;while(pris.has(id))id=o.id+'-'+(k++);o.id=id;etat.inventaire.push(o)}
    else if(p.type==='conso')etat.consommables[p.id]=(etat.consommables[p.id]||0)+p.q;
    else if(p.type==='carburant')etat.vaisseau.carburant=Math.min(reservoir().capacite,etat.vaisseau.carburant+p.q);
    else etat.ressources[p.id]=(etat.ressources[p.id]||0)+p.q;
    dire(`Atelier : ${nomProduit(rc)} terminé${p.type==='objet'?' et rangé dans la soute':''}.`);
  }
  if(fini){verifierSucces();notifier('🛠️ Atelier',`${fini} fabrication${fini>1?'s':''} terminée${fini>1?'s':''}.`);sauver()}
  return fini>0;
}
// Ceinture de consommables du Jimee (armurerie)
function emporter(id){const j=etat.jimee;if(!j||etat.mission||!(etat.consommables[id]>0)||j.ceinture.length>=ATELIER.ceintureMax)return;
  etat.consommables[id]--;if(!etat.consommables[id])delete etat.consommables[id];j.ceinture.push(id);dire(`${CONSOMMABLES[id].nom} accroché à la ceinture de ${j.nom}.`);tout()}
function deposer(i){const j=etat.jimee;if(!j||etat.mission||!j.ceinture[i])return;const id=j.ceinture.splice(i,1)[0];etat.consommables[id]=(etat.consommables[id]||0)+1;tout()}

const iconeProduit=k=>ICONES_PRODUITS[k]?`<svg viewBox="0 0 48 48" aria-hidden="true">${ICONES_PRODUITS[k]}</svg>`:iconeRessource(k);
function cleIconeRecette(rc){const p=rc.produit;if(p.type==='objet')return CATALOGUE.find(m=>m.nom===p.modele).emplacement;if(p.type==='conso')return p.id;if(p.type==='carburant')return 'carburant';return p.id}
function descProduit(rc){
  const p=rc.produit;
  if(p.type==='objet'){const m=CATALOGUE.find(x=>x.nom===p.modele);return descObjet(creerObjet(creerRng('apercu'),m,p.niveau,'B'))}
  if(p.type==='conso')return CONSOMMABLES[p.id].desc+(p.q>1?` Fabriqué par ${p.q}.`:'');
  if(p.type==='carburant')return `Raffine en ${p.q} unités de carburant, livrées directement dans le réservoir.`;
  return `Transforme en ${p.q} ${RES[p.id].nomMin}.`;
}
const ligneCoutAtelier=(id,q,connu)=>{const a=etat.ressources[id]||0,ok=a>=q;return `<div class="cout ${connu?(ok?'ok':'ko'):''}"><span class="icone-res">${iconeRessource(id)}</span><span>${RES[id].nom}</span><b>${connu?`${a} / ${q} ${ok?'✓':''}`:`? / ${q}`}</b></div>`};
function carteRecette(rc){
  const connu=etat.plans.includes(rc.id),manque=manquants(rc.couts).length,plein=etat.atelier.file.length>=ATELIER.fileMax;
  return `<div class="recette${connu?'':' inconnue'}">
    <div class="article-tete"><span class="icone-res">${iconeProduit(cleIconeRecette(rc))}</span>
      <span class="article-nom">${nomProduit(rc)}<small>${connu?descProduit(rc):`Plan inconnu (palier ${rc.palier}). À trouver dans les ruines, épaves, donjons, coffres ou nids de dragon.`}</small></span>
      <span class="article-prix"><b>${rc.minutes} min</b><small>${connu?'temps de fabrication':'verrouillé'}</small></span></div>
    ${connu?`<div class="couts">${Object.entries(rc.couts).map(([id,q])=>ligneCoutAtelier(id,q,true)).join('')}</div>
    <button class="btn" data-action="fabriquer" data-recette="${rc.id}" ${manque||plein?'disabled':''}>Fabriquer</button>
    ${manque?`<p class="note">Il manque ${listeRessources(Object.fromEntries(manquants(rc.couts)))}</p>`:plein?`<p class="note">File pleine (${ATELIER.fileMax} tâches au maximum).</p>`:''}`:''}
  </div>`;
}
function blocFileAtelier(){
  const f=etat.atelier.file;
  if(!f.length)return `<div class="file-atelier vide-file"><b>File de fabrication</b><span>Vide. L'établi s'ennuie.</span></div>`;
  const maint=Date.now();
  return `<div class="file-atelier"><b>File de fabrication (${f.length} / ${ATELIER.fileMax})</b>${f.map((t,i)=>{
    const nom=t.type==='amelioration'?`${t.obj.nom} → niv. ${t.obj.niveau+1}`:nomProduit(RECETTE[t.recette]),enCours=t.debut<=maint;
    const pct=enCours?Math.min(100,(maint-t.debut)/(t.fin-t.debut)*100):0;
    return `<div class="tache"><div><span>${nom}</span><small id="af-t-${i}">${enCours?`en cours · ${restant(t.fin-maint)}`:`en attente · ${restant(t.fin-maint)}`}</small>
      <div class="barre"><i id="af-b-${i}" style="width:${pct}%"></i></div></div><button type="button" class="fermer-fiche" data-action="annuler-tache" data-tache="${i}" aria-label="Annuler et rembourser">×</button></div>`}).join('')}</div>`;
}
function majFileAtelier(){
  const maint=Date.now();etat.atelier.file.forEach((t,i)=>{const s=$('#af-t-'+i),b=$('#af-b-'+i);if(!s)return;const enCours=t.debut<=maint;
    s.textContent=`${enCours?'en cours':'en attente'} · ${restant(t.fin-maint)}`;if(b)b.style.width=(enCours?Math.min(100,(maint-t.debut)/(t.fin-t.debut)*100):0)+'%'});
}
function panneauAtelier(){
  const connus=etat.plans.length;
  let h=`<h2>Atelier de fabrication</h2><p class="sous">Plans connus : ${connus} / ${RECETTES.length}. Les ressources sont prélevées au lancement et rendues si vous annulez.</p>
    ${blocFileAtelier()}
    <div class="puces-filtre onglets-atelier">${ONGLETS_ATELIER.map(([id,n])=>`<button type="button" data-atelier-onglet="${id}" aria-pressed="${atelierOnglet===id}">${n}</button>`).join('')}</div>`;
  if(['equipement','consommable','materiau'].includes(atelierOnglet)){
    const liste=RECETTES.filter(r=>r.cat===atelierOnglet).sort((a,b)=>(etat.plans.includes(b.id)-etat.plans.includes(a.id))||a.palier-b.palier);
    if(atelierOnglet==='consommable')h+=`<p class="note">${Object.entries(etat.consommables).filter(([,q])=>q>0).map(([id,q])=>`${q} ${CONSOMMABLES[id].nom.toLowerCase()}`).join(', ')||'rien'}. Le Jimee en emporte ${ATELIER.ceintureMax} à sa ceinture (armurerie) ; ils s'utilisent tout seuls au bon moment.</p>`;
    h+=liste.map(carteRecette).join('');
  } else if(atelierOnglet==='ameliorer'){
    const objs=etat.inventaire.filter(o=>o.stat||o.effet);
    h+=`<p class="note">Un objet de la soute peut gagner ${ATELIER.ameliorationMax} niveaux au maximum à l'atelier. Les objets équipés doivent d'abord être retirés.</p>`;
    h+=objs.length?objs.map(o=>{const ok=peutEtreAmeliore(o),c=coutAmeliorationObjet(o),manque=manquants(c).length;
      return `<div class="recette"><div class="article-tete"><span class="icone-res">${iconeProduit(o.emplacement)}</span><span class="article-nom"><span class="rar-${o.rarete}">${o.nom}</span><small>niv. ${o.niveau}${ok?` → ${o.niveau+1}`:''} · amélioré ${o.ameliorations||0} / ${ATELIER.ameliorationMax}</small></span><span class="article-prix"><b>${ok?minutesAmeliorationObjet(o)+' min':'max'}</b></span></div>
        ${ok?`<div class="couts">${Object.entries(c).map(([id,q])=>ligneCoutAtelier(id,q,true)).join('')}</div><button class="btn" data-action="ameliorer-objet" data-obj="${o.id}" ${manque||etat.atelier.file.length>=ATELIER.fileMax?'disabled':''}>Améliorer au niveau ${o.niveau+1}</button>`:''}</div>`}).join(''):`<p class="note">Soute vide.</p>`;
  } else {
    h+=`<p class="note">Démonte un objet de la soute en ressources, immédiatement. L'objet est détruit.</p>`;
    h+=etat.inventaire.length?etat.inventaire.map(o=>`<div class="recette"><div class="article-tete"><span class="icone-res">${iconeProduit(o.emplacement)}</span><span class="article-nom"><span class="rar-${o.rarete}">${o.nom}</span><small>niv. ${o.niveau} · classe ${o.rarete} → ${listeRessources(recyclageObjet(o))}</small></span><span class="article-prix"><button class="btn sec" data-action="recycler" data-obj="${o.id}">Recycler</button></span></div></div>`).join(''):`<p class="note">Soute vide.</p>`;
  }
  return h;
}

const REPUTATION={
  rangs:[{min:0,nom:'Stagiaire jetable'},{min:40,nom:'Sous-traitant'},{min:120,nom:'Associé'},{min:300,nom:'Partenaire privilégié'}],
  parMission:2,                 // réputation gagnée à chaque mission réussie
  echecContrat:5,               // réputation perdue quand un contrat expire (C9)
  classeB:1, classeA:2, classeS:3, agence3:2, remiseMarche:3, remise:.9   // rang requis pour chaque avantage
};
const rangCorp=()=>{let k=0;REPUTATION.rangs.forEach((x,i)=>{if(etat.reputation>=x.min)k=i});return k};
const CONTRATS={offres:3,actifsMax:3,dureeH:48,dureeUrgentH:24,chanceUrgent:.5};
const jourDuJour=()=>{const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
// Génère les offres du jour (déterministe : jour + nombre de renouvellements développeur)
function genererOffres(){

function tableExpedition(p){const t={};for(const [id,po] of Object.entries(ressourcesPlanete(p)))if(po>0&&RES[id]&&RES[id].extraction!=='faune'&&EXPEDITIONS.raretes[RES[id].rarete])t[id]=po;return t}
function valeurAttendueExpedition(p,h){
  const t=tableExpedition(p),parR={};for(const [id,po] of Object.entries(t)){const k=RES[id].rarete;(parR[k]=parR[k]||[]).push([id,po])}
  const rs=Object.keys(parR);if(!rs.length)return {unites:0,valeur:0};
  const totP=rs.reduce((s,k)=>s+EXPEDITIONS.raretes[k],0);
  const prixU=rs.reduce((s,k)=>{const l=parR[k],tp=l.reduce((a,[,po])=>a+po,0);return s+EXPEDITIONS.raretes[k]/totP*l.reduce((a,[id,po])=>a+RES[id].prix*po/tp,0)},0);

function resoudreExpedition(p,h,seed,stockDispo){
  const r=creerRng(seed),t=tableExpedition(p),trouves={};
  const unites=Math.round(r.int(EXPEDITIONS.parHeure[0]*h*10,EXPEDITIONS.parHeure[1]*h*10)/10*MULT_RESSOURCES_CLASSE[p.classe]);
  const raretes=Object.entries(EXPEDITIONS.raretes).filter(([k])=>Object.keys(t).some(id=>RES[id].rarete===k)).map(([id,poids])=>({id,poids}));

// Livraison à l'échéance : idempotent (une expédition passe une seule fois de en_cours à terminee, dans la même sauvegarde)
function finaliserExpeditions(){
  let change=false;
  for(const x of (etat.expeditions||[])){
    if(x.statut!=='en_cours'||Date.now()<x.fin)continue;
    const res=x.resultat;
    for(const [id,q] of Object.entries(res.ressources))etat.ressources[id]=(etat.ressources[id]||0)+q;
    if(res.objet){const pris=new Set([...etat.inventaire,...(etat.jimee?objetsEquipes(etat.jimee):[])].map(o=>o.id));let oid=res.objet.id,k=1;while(pris.has(oid))oid=res.objet.id+'-'+(k++);res.objet.id=oid;etat.inventaire.push(res.objet)}
    x.statut='terminee';change=true;
    const n=totalRessources(res.ressources);
    notifier(res.issue==='devoree'?'🦖 Escouade Corp dévorée':'📦 Escouade Corp de retour',res.issue==='devoree'?`Rien ne revient de ${x.nomPlanete}.`:`${n} unité${n>1?'s':''} rapportée${n>1?'s':''} de ${x.nomPlanete}.`);
    dire(res.issue==='devoree'?`L'escouade ${x.id} ne reviendra pas de ${x.nomPlanete}. Rapport disponible.`:`L'escouade ${x.id} est rentrée de ${x.nomPlanete}. Butin déchargé en soute.`);
  }
  if(change){const lues=etat.expeditions.filter(x=>x.statut==='terminee'&&x.lu),garder=new Set(lues.slice(-10).map(x=>x.id));
    etat.expeditions=etat.expeditions.filter(x=>x.statut!=='terminee'||!x.lu||garder.has(x.id));sauver()}
  return change;
}

      pillageEnCours=false;derniereSync=0;synchroniser(true);return tout()}
  }catch(err){pillageEnCours=false;dire('Pas de connexion avec la partie : rien n\'a été facturé. Réessayez dans un instant.');return tout()}

// Kit complet de test : un objet par slot, au niveau de base de la classe de planète
function kitDeTest(classe,seed){
  const r=creerRng(seed), eq=equipementVide(), niveau=CONFIG.niveauBaseParClasse[classe]+1;
  for(const sl of SLOTS){
    const modeles=sl.id==='sac_utilitaire'?CATALOGUE.filter(m=>m.effet==='oxygene'):CATALOGUE.filter(m=>m.emplacement===sl.accepte);
    eq[sl.id]=creerObjet(r,r.pick(modeles),niveau,'B');
  }
  return eq;
}
// Kit « full stuff » : classe A, niveau de base de la planète + 2, objets choisis pour équilibrer les stats,
// utilitaire adapté au biome (bouée sur les mondes d'eau, oxygène sur les volcans…)
const UTILITAIRE_CONSEILLE={ocean:'bouee',jungle:'bouee',volcan:'oxygene',glace:'thermos',roche:'corde',metal:'corde'};
function kitOptimal(p,seed){
  const r=creerRng(seed),n=Math.min(CONFIG.niveauMaxObjet,CONFIG.niveauBaseParClasse[p.classe]+2),eq=equipementVide();
  const m=nom=>CATALOGUE.find(x=>x.nom===nom);
  const choix={tete:m('Casque anti-radiation'),buste:m('Combinaison thermique'),bras_droit:m('Marteau rouillé'),bras_gauche:m('Gants d\'écoute sismique'),
    jambes:m('Bottes à ressorts'),sac_stockage:m('Soute dorsale pliable'),sac_utilitaire:CATALOGUE.find(x=>x.effet===UTILITAIRE_CONSEILLE[p.biome.id])};
  for(const s of SLOTS)eq[s.id]=creerObjet(r,choix[s.id],n,'A');
  return eq;
}
// Profils du simulateur : [nom, fabrique(planète, i)]
const PROFILS_SIM=[
  ['G nu',(p,i)=>genererJimee('LAB/'+i,'G')],
  ['G équipé',(p,i)=>{const j=genererJimee('LAB/'+i,'G');j.equipement=kitDeTest(p.classe,'KIT/'+p.id+'/'+i);return j}],
  ['A nu',(p,i)=>genererJimee('LAB/'+i,'A')],
  ['A full',(p,i)=>{const j=genererJimee('LAB/'+i,'A');j.equipement=kitOptimal(p,'KITA/'+p.id+'/'+i);return j}]
];
function lancerSimulation(){
  const N=150;
  const lignes=galaxie.planetes.map(p=>{
    let valeur=0;const causes={};
    const taux=PROFILS_SIM.map(([nom,f],k)=>{let v=0;for(let i=0;i<N;i++){const res=simuler(p,f(p,i),'LABSIM/'+p.id+'/'+i);

// Matrice sur tout l'univers : 12 planètes par classe (la galaxie de départ n'a pas de planète S)
// V13 : grille Jimee nu × classe de planète, sur des planètes générées hors univers (graines fixes = comparable d'une version à l'autre)
const GRILLE={planetesParClasse:20,missionsParPlanete:20};
function poolPlanetesParClasse(n){
  const pool=Object.fromEntries(ORDRE_CLASSES.map(c=>[c,[]]));
  for(let i=0;i<20000&&ORDRE_CLASSES.some(c=>pool[c].length<n);i++){const p=genererPlanete('GRILLE/'+i,(i%10)*5);if(pool[p.classe].length<n)pool[p.classe].push(p)}
  return pool;
}
function grilleSurvie(n,runs,prefixe='GR'){
  const pool=poolPlanetesParClasse(n),g={};
  for(const cj of CLASSES_JIMEE){g[cj.id]={};for(const cp of ORDRE_CLASSES){let v=0,t=0;
    pool[cp].forEach((p,k)=>{for(let i=0;i<runs;i++){if(simuler(p,genererJimee(prefixe+'J/'+cj.id+'/'+k+'/'+i,cj.id),prefixe+'S/'+k+'/'+i).survie)v++;t++}});
    g[cj.id][cp]=t?v/t*100:null}}
  return g;
}
function lancerGrille(){
  const g=grilleSurvie(GRILLE.planetesParClasse,GRILLE.missionsParPlanete);
  $('#grille').innerHTML=`<div style="overflow-x:auto"><table><tr><th>Jimee</th>${ORDRE_CLASSES.map(c=>`<th>${c}</th>`).join('')}</tr>
    ${CLASSES_JIMEE.map(cj=>`<tr><td>${cj.id}</td>${ORDRE_CLASSES.map(cp=>`<td>${g[cj.id][cp]===null?'–':Math.round(g[cj.id][cp])+' %'}</td>`).join('')}</tr>`).join('')}</table></div>
    <p class="note">Lignes : Jimee nu de chaque classe. Colonnes : classe de planète (${GRILLE.planetesParClasse} planètes × ${GRILLE.missionsParPlanete} missions par case). Cible : 88 % sur sa classe, ~55 % une classe au-dessus, ~10 % deux classes au-dessus.</p>`;
}
function lancerMatrice(){
  const N=60,parClasse=Object.fromEntries(ORDRE_CLASSES.map(c=>[c,[]]));
  for(const g of univers.galaxies){if(Object.values(parClasse).every(l=>l.length>=12))break;for(const p of chargerGalaxie(g).planetes)if(parClasse[p.classe].length<12)parClasse[p.classe].push(p)}
  const lignes=PROFILS_SIM.map(([nom,f])=>`<tr><td>${nom}</td>${Object.values(parClasse).map(l=>{let v=0,t=0;for(const p of l)for(let i=0;i<N;i++){t++;if(simuler(p,f(p,i),'MAT/'+p.id+'/'+i).survie)v++}return `<td>${t?Math.round(v/t*100)+' %':'–'}</td>`}).join('')}</tr>`).join('');
  $('#matrice').innerHTML=`<table><tr><th>Profil</th>${Object.keys(parClasse).map(c=>`<th>Planète ${c}</th>`).join('')}</tr>${lignes}</table><p class="note">Survie moyenne sur 12 planètes par classe prises dans tout l'univers, ${N} missions chacune.</p>`;
}

}
// V23 : étapes du rapport. 'journal' = lignes qui défilent ; 'bilan' = butin / conséquences sur tout l'écran.

// V14 (lot A) : libellé d'une perte du rapport
const NOMS_GRAVITE={leger:'léger',grave:'grave',total:'total'};
function libellePerte(e){
  const tal=e.talent?(TALENTS.find(t=>t.id===e.talent)||{nom:e.talent}).nom:null;
  if(e.cause==='sac')return 'Sac plein : laissé sur place';
  if(e.cause==='gache')return `Récolte gâchée${tal?` (talent ${tal})`:''}`;
  if(e.cause==='gardien')return 'Butin semé en fuyant le gardien légendaire';
  if(e.cause==='incident')return `Incident au retour, ${NOMS_GRAVITE[e.gravite]||''} (${e.part} % du butin)${tal?` · talent ${tal}`:' · malchance'}`;
  if(e.cause==='route:marchand')return 'Échangé chez le marchand ambulant';
  if(e.cause==='route:acide')return 'Rongé par les pluies acides';
  const id=e.cause.replace('route:','');return `En route : ${(ETAPES_NOMS[id]||id).toLowerCase()}`;
}
const lignesStock=stock=>{const l=listeRessources(stock);return l?`<div class="bloc-pastilles">${l}</div>`:''};   // V19 : pastilles au lieu d'une ligne par ressource
// Découvert → perdu (par cause) → ramené. Les deux étapes sont distinctes : le rapport explique toujours l'écart.
function blocTrouvePerdu(r,gains,lignesRamenees){
  const nT=totalRessources(r.trouves),vT=valeurRessources(r.trouves),nG=totalRessources(gains),vG=valeurRessources(gains);
  const pertes=(r.pertes||[]).filter(e=>totalRessources(e.ressources)>0);
  const nP=pertes.reduce((s,e)=>s+totalRessources(e.ressources),0);
  return `<div class="bloc"><b>Découvert :</b> ${nT?`${nT} unité${nT>1?'s':''} (valeur ${vT} cr)`:'rien'}</div>${lignesStock(r.trouves)}
    ${pertes.length?`<div class="bloc"><b>Perdu :</b> ${nP} unité${nP>1?'s':''}</div>${pertes.map(e=>`<div class="ligne"><span>${libellePerte(e)}</span><span>${listeRessources(e.ressources)}</span></div>`).join('')}`:''}
    <div class="bloc"><b>Ramené au vaisseau :</b> ${nG?`${nG} unité${nG>1?'s':''}, valeur de rachat ${vG} cr`:'rien'}</div>${lignesRamenees}
    ${(r.influences||[]).length||r.risqueIncident!=null?`<div class="bloc"><b>Influence du Jimee :</b></div><p class="note">${[...(r.influences||[]),...(r.risqueIncident!=null?[`Risque d'incident au retour : ${Math.round(r.risqueIncident*100)} %`]:[])].join('<br>')}</p>`:''}
    ${nT&&!nG?`<p class="avert">Mission bien remplie, butin perdu en chemin. La Jimee's Corp vous rappelle que l'expérience acquise, elle, ne se revend pas.</p>`:''}`;
}
// Bilan détaillé d'une mission réussie : ressources, crédits, objets, blessures, cargaison
function bilanMission(r,gains){
  const nb=totalRessources(gains), val=valeurRessources(gains);
  const lignesRes=Object.entries(gains).sort((a,b)=>RES[b[0]].prix*b[1]-RES[a[0]].prix*a[1])
    .map(([id,q])=>`<div class="ligne"><span>${RES[id].nom} <small class="res-${RES[id].rarete}">· ${RARETES_RESSOURCE[RES[id].rarete].nom}</small></span><span>${q} × ${RES[id].prix} cr</span></div>`).join('');
  const perdus=totalRessources(r.perdusEnRoute);
  const blocRes=r.trouves?blocTrouvePerdu(r,gains,lignesRes)   // V14 : missions lancées après la mise à jour
    :`<div class="bloc"><b>Ressources :</b> ${nb?`${nb} unité${nb>1?'s':''}, valeur de rachat ${val} cr`:'aucune'}</div>${lignesRes}
    ${perdus?`<p class="note">Perdu en route : ${listeRessources(r.perdusEnRoute)}.</p>`:''}`;
  return `<b>Résultat : retour au vaisseau.</b>
    ${r.emplacements?`<div class="bloc"><b>Sac :</b> ${r.emplacementsUtilises} / ${r.emplacements} emplacements utilisés</div>`:''}
    ${blocRes}
    <div class="bloc"><b>Crédits :</b> ${r.credits}</div>
    <div class="bloc"><b>Objets :</b> ${r.objets.length?r.objets.map(o=>`<span class="rar-${o.rarete}">${o.nom} (niv. ${o.niveau})</span>`).join(', '):'aucun'}</div>
    <div class="bloc"><b>Blessures :</b> ${r.blessures?`${r.blessures}, à soigner à l'infirmerie (−1 endurance chacune en attendant)`:'aucune'}</div>
    ${r.palier?`<div class="bloc"><b>Promotion :</b> rang ${r.palier}</div>`:''}
    ${(r.eveils||[]).map(e=>`<div class="bloc eveil"><b>✦ Éveil :</b> ${e.texte}<br><small>${STATS_NOMS[e.stat]} de base +${PROGRESSION_CACHEE.bonus}, définitivement.</small></div>`).join('')}
    ${(r.evolutions||[]).length?`<div class="bloc"><b>Évolution :</b> ${r.evolutions.join(' · ')}</div>`:''}
    ${(r.consommes||[]).length?`<div class="bloc"><b>Consommables utilisés :</b> ${r.consommes.map(id=>CONSOMMABLES[id].nom).join(', ')}</div>`:''}
    ${(r.plansNouveaux||[]).length?`<div class="bloc"><b>Nouveaux plans :</b> ${r.plansNouveaux.map(id=>nomProduit(RECETTE[id])).join(', ')} (à l'atelier)</div>`:''}
    ${r.plansDoublons?`<div class="bloc"><b>Plans en double :</b> ${r.plansDoublons}, revendus ${r.plansDoublons*ATELIER.doublonCredits} cr</div>`:''}`;
}
function ouvrirRapport(){
  const m=etat.mission;if(!m||Date.now()<m.fin)return;
  const r=m.resultat,j=etat.jimee;
  const lignesContrats=contratsApresMission(m,r);
  // Le journal est calculé sur 12 h ; un réacteur amélioré raccourcit la mission, donc les heures affichées
  const fh=(m.dureeH||12)/12;
  let bilan;
  // Application du résultat (une seule fois : la mission est effacée juste après)
  if((r.gardienRencontre||(r.etapesIds||[]).includes('gardien'))&&!etat.bossVus[cleGal()])etat.bossVus[cleGal()]='vu';
  if(r.survie){
    // Garde-fou : un identifiant d'objet doit rester unique dans toute la partie
    const pris=new Set([...etat.inventaire,...objetsEquipes(j),...etat.abandons.flatMap(x=>x.objets),...etat.recuperations.flatMap(x=>x.objets)].map(o=>o.id));
    for(const o of r.objets){let id=o.id,k=1;while(pris.has(id))id=o.id+'-'+(k++);o.id=id;pris.add(id)}
    const gains=r.ressources||(r.fer?{fer:r.fer}:{});   // r.fer : mission lancée avant la mise à jour
    for(const [id,q] of Object.entries(gains))etat.ressources[id]=(etat.ressources[id]||0)+q;
    etat.credits+=r.credits;etat.inventaire.push(...r.objets);j.missions++;
    etat.reputation+=REPUTATION.parMission;etat.stats.missions++;
    if(m.cleCarto)etat.cartographie[m.cleCarto]=(etat.cartographie[m.cleCarto]||0)+1;
    if((r.gardienRencontre||(r.etapesIds||[]).includes('gardien'))&&etat.bossVus[cleGal()]!=='vaincu')etat.bossVus[cleGal()]='vu';   // V20 : le gardien est désormais repéré sur la carte
    if(m.cleCarto&&r.objets.length)etat.equipementsPris[m.cleCarto]=(etat.equipementsPris[m.cleCarto]||0)+r.objets.length;
    etat.stats.donjons+=(r.exploits||{}).donjon||0;
    if((r.exploits||{}).gardien){etat.bossVus[cleGal()]='vaincu';etat.stats.gardiens++;if(!etat.gardiensVaincus.includes(etat.galaxieActuelle))etat.gardiensVaincus.push(etat.galaxieActuelle)}
    if(r.legendaire&&!etat.legendairesObtenus.includes(r.legendaire)){etat.legendairesObtenus.push(r.legendaire);etat.inventaire.push(creerLegendaire(r.legendaire,etat.compteur))}etat.stats.dragons+=(r.exploits||{}).dragon||0;
    if(rangClasse(m.classe)>=rangClasse('S')&&(r.ressources||{}).perle)etat.stats.perleS++;
    // Consommables utilisés : retirés de la ceinture ; plans : appris, ou revendus s'ils sont en double
    for(const id of (r.consommes||[])){const k=j.ceinture.indexOf(id);if(k>=0)j.ceinture.splice(k,1)}
    // J6 : blessures persistantes ; J3 : vécu et talents évolutifs ; J5 : vétérance
    j.blessures=Math.min(INFIRMERIE.blessuresMax,(j.blessures||0)+r.blessures);
    r.evolutions=[];r.palier=null;
    if(r.etapesIds){j.vecu=j.vecu||{};for(const id of r.etapesIds)j.vecu[id]=(j.vecu[id]||0)+1;if(r.climat)j.vecu['climat:'+r.climat]=(j.vecu['climat:'+r.climat]||0)+1}
    // V15 : expérience (blessures encaissées, missions réussies au-dessus de sa classe) puis éveils cachés
    j.experience=j.experience||{blessures:0,auDessus:0};j.experience.blessures+=r.blessures||0;if(m.classe&&rangClasse(m.classe)>rangClasse(j.classe))j.experience.auDessus++;
    r.eveils=eveilsCaches(j);
    for(const def of [...j.talents]){const ev=EVOLUTIONS[def];if(!ev)continue;
      const n=ev.missions?j.missions:ev.climat?(j.vecu['climat:'+ev.climat]||0):ev.etapes.reduce((s,id)=>s+(j.vecu[id]||0),0);
      if(n>=(ev.missions||ev.n)){const pool=TALENTS.filter(t=>t.type==='qualite'&&!j.talents.includes(t.id)&&(!t.classes||t.classes.includes(j.classe)));
        const nouv=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;j.talents=j.talents.filter(x=>x!==def);if(nouv)j.talents.push(nouv.id);
        r.evolutions.push(`${TALENTS.find(t=>t.id===def).nom} corrigé par l'expérience${nouv?` : devient ${nouv.nom}`:''}`)}}
    const rg=RANGS.find(x=>x.missions===j.missions&&x.missions>0);
    if(rg){r.palier=rg.nom;if(rg===RANGS[RANGS.length-1])etat.stats.legendes++;
      if(rg===RANGS[RANGS.length-1]){const pool=TALENTS.filter(t=>t.type==='qualite'&&!j.talents.includes(t.id));if(pool.length){const q=pool[Math.floor(Math.random()*pool.length)];j.talents.push(q.id);r.evolutions.push(`Légende : nouvelle qualité ${q.nom}`)}}}
    r.plansNouveaux=[];r.plansDoublons=0;
    for(const id of (r.plans||[])){if(etat.plans.includes(id)||r.plansNouveaux.includes(id)){r.plansDoublons++;etat.credits+=ATELIER.doublonCredits}else{etat.plans.push(id);r.plansNouveaux.push(id)}}
    dire(`${j.nom} est de retour. Butin déchargé en soute.`);
    bilan=bilanMission(r,gains);
  } else {
    const ab=abandonnerEquipement(j,m);
    multiEvenement('mort',`${etat.multi.pseudo||'Votre ami'} a perdu ${j.nom} sur ${m.nomPlanete} (${galaxieCourante().nom}).${ab?` ${ab.objets.length} équipement${ab.objets.length>1?'s sont restés':' est resté'} sur place : l'épave est ouverte au pillage.`:''}`);
    etat.stats.morts++;
    etat.memorial.push({type:'mort',nom:j.nom,classe:j.classe,matricule:j.matricule,missions:j.missions,planeteId:m.planeteId,galaxie:etat.galaxieActuelle,planete:m.nomPlanete,cause:ETAPES_NOMS[r.causeMort]||'inconnue',date:Date.now()});
    etat.morts++;etat.jimee=null;
    if(ab)corpOnglet='agence';
    dire(ab?`Signal de ${j.nom} perdu. ${ab.objets.length} équipement${ab.objets.length>1?'s':''} sur ${m.nomPlanete}. L'Agence de récupération attend votre appel.`
           :`Signal de ${j.nom} perdu. De nouveaux Jimees sont disponibles à la Corp à partir de ${PRIX_JIMEE_G} crédits.`);
    bilan=`Butin perdu avec le Jimee. La Jimee's Corp vous présente ses condoléances commerciales.`
      +(r.trouves&&totalRessources(r.trouves)?`<div class="bloc"><b>Découvert avant la perte du signal :</b> ${listeRessources(r.trouves)}.</div>`:'')
      +(totalRessources(r.cargaisonPerdue)?`<div class="bloc"><b>Cargaison perdue :</b> ${listeRessources(r.cargaisonPerdue)} (environ ${valeurRessources(r.cargaisonPerdue)} cr).</div>`:'')
      +(ab?`<div class="bloc"><b>Restés sur ${m.nomPlanete} :</b> ${ab.objets.map(o=>`<span class="rar-${o.rarete}">${o.nom} (niv. ${o.niveau})</span>`).join(', ')}.<br>Rendez-vous à l'Agence de récupération de la Jimee's Corp pour tenter de les rapatrier.</div>`:'');
  }
  if(lignesContrats.length)bilan+=`<div class="bloc"><b>Contrats :</b> ${lignesContrats.join(' ')}</div>`;
  etat.mission=null;verifierSucces();sauver();
  const sous=r.survie
    ?`${j.nom} est rentré vivant${r.blessures?`, avec ${r.blessures} blessure${r.blessures>1?'s':''} à soigner à l'infirmerie`:''}.`
    :`${j.nom} n'est pas rentré. Décès estimé à T${hFmt(r.heureMort*fh)} après l'atterrissage.`;
  etat._typeRapport=r.survie?'mission':'mort';
  etat._sceneRapport={biome:m.biome,survie:!!r.survie,classe:j.classe};   // V26 : scène animée du rapport
  verifierDeblocages();if(etat.guide&&missionsTerminees()>0){etat.guide=false;$('#ia').classList.remove('guide')}   // V26 : fin du guide, services gagnés (annoncés à la fermeture du rapport)
  if(r.survie)bilan=butinVisuel(r,r.ressources||{})+bilan;else bilan=finVisuelle(j)+bilan;
  reveler(`Rapport de mission : ${m.nomPlanete}`,sous,r.etapes.map(e=>({ton:e.ton,etiquette:'T'+hFmt(e.h*fh),txt:e.txt,id:e.id})),bilan);
}

function ouvrirRapportRecup(id){
  const rec=etat.recuperations.find(x=>x.id===id);
  if(!rec||rec.statut!=='terminee')return;
  const ag=agence(rec.niveauAgence), res=rec.resultat, parId=Object.fromEntries(rec.objets.map(o=>[o.id,o]));
  const nomO=o=>`${o.nom} (${nomEmplacement(o.emplacement).toLowerCase()}, niv. ${o.niveau})`;
  const lignes=[];
  if(!res.succes){
    lignes.push({ton:'mort',etiquette:'Jet 1',txt:`❌ L'équipe n'est pas revenue (jet ${res.jetRetour}, il fallait ${res.seuilRetour} ou moins). Aucun équipement n'a pu être récupéré.`});
  } else {
    lignes.push({ton:'bon',etiquette:'Jet 1',txt:`🏃 L'équipe est revenue ! (jet ${res.jetRetour}, il fallait ${res.seuilRetour} ou moins)`});
    lignes.push({ton:'neutre',etiquette:'Jet 2',txt:`Capacité de récupération : ${res.nbTentes} / ${rec.objets.length} objet${rec.objets.length>1?'s':''} (tranche ${Math.round(res.part*100)} %). Les objets tentés sont choisis par l'équipe, pas par vous.`});
    res.essais.forEach((e,i)=>lignes.push({ton:e.ok?'bon':'mauvais',etiquette:'Objet '+(i+1),
      txt:`${nomO(parId[e.id])} · ${e.chance} % de chances · ${e.ok?'🟢 récupéré':'🔴 perdu définitivement'}`}));
  }
  const liste=ids=>ids.length?ids.map(id=>nomO(parId[id])).join(', '):'aucun';
  const surPlace=res.succes?RECUP.nonTentesRestentSurPlace:RECUP.echecEquipeLaisseLesObjets;
  const bilan=res.succes
    ?`<div class="bloc"><b>🟢 Récupérés :</b> ${liste(res.recupereIds)}</div>
      <div class="bloc"><b>🔴 Perdus :</b> ${liste(res.perduIds)}</div>
      <div class="bloc"><b>⚫ Non tentés :</b> ${liste(res.nonTenteIds)}${res.nonTenteIds.length?(surPlace?' (toujours sur la planète)':' (perdus à jamais)'):''}</div>
      <p class="citation">« ${ag.succes[res.phrase]} »</p>`
    :`<div class="bloc"><b>Aucun équipement récupéré.</b>${surPlace?` Les ${rec.objets.length} objets sont toujours sur ${rec.nomPlanete}.`:` Les ${rec.objets.length} objets sont perdus à jamais.`}</div>
      <p class="citation">« ${ag.echec} »</p>`;
  rec.lu=true;sauver();
  etat._typeRapport=rec.pillage?'pillage':'recup';
  reveler(`🛟 Rapport de récupération ${rec.id}`,`${rec.nomPlanete} · équipe : ${ag.nom} · durée ${mmss(rec.fin-rec.debut)} · facture ${rec.prix} cr`,lignes,bilan);
}

/* =========================================================
   15 bis. V26 — ARRIVÉE PROGRESSIVE, GUIDE, ANNONCES, BRUITAGES, RAPPORT ANIMÉ
   ========================================================= */
// ---------- Déblocages ----------
const debloque=k=>!etat.deblocages||!DEBLOCAGES[k]||etat.deblocages[k]===true;
const missionsTerminees=()=>(etat.stats.missions||0)+(etat.stats.morts||0);
let annonces=[];   // services débloqués à annoncer (non sauvegardé : une annonce manquée n'est pas grave, le service reste ouvert)
function verifierDeblocages(){
  if(!etat.deblocages)return;
  const n=missionsTerminees();
  for(const [k,d] of Object.entries(DEBLOCAGES)){
    if(etat.deblocages[k])continue;
    const ok=(d.missions&&n>=d.missions)||(d.reussites&&(etat.stats.missions||0)>=d.reussites)||(d.morts&&(etat.stats.morts||0)>=d.morts)||(k==='agence'&&etat.abandons.length>0);
    if(!ok)continue;
    etat.deblocages[k]=true;
    if(d.nom&&!annonces.includes(k))annonces.push(k);
  }
}
// Un clic sur un service verrouillé : quel service ?
function verrouClic(t){
  const d=t.dataset;
  if(d.marche&&!debloque('marche'))return 'marche';

    <div class="butin-chiffres">${r.credits?`<span><b data-compte="${r.credits}">${r.credits}</b><small>crédits</small></span>`:''}<span><b data-compte="${nb}">${nb}</b><small>unités ramenées</small></span><span><b data-compte="${val}">${val}</b><small>cr de valeur</small></span></div>
    ${tuiles?`<div class="tuiles-butin">${tuiles}</div>`:''}
    ${cartes?`<div class="cartes-objets">${cartes}</div>`:''}
  </div>`;
}
function finVisuelle(j){
  return `<div class="butin fin"><div class="fin-perso">${persoJimee({etat:'mort'})}</div><p class="tampon-fin">Contrat terminé</p><p class="fin-nom">${j.nom} · classe ${j.classe} · ${j.missions} mission${j.missions>1?'s':''}</p></div>`;
}
function animerBilan(){
  const b=$('#butin-anime')||$('#bilan .butin');if(!b)return;
  const reduit=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(b.classList.contains('fin')){if(!reduit)bruit('mort');return}
  b.classList.remove('joue');void b.offsetWidth;b.classList.add('joue');
  if(reduit)return;
  b.querySelectorAll('[data-compte]').forEach(el=>{const cible=+el.dataset.compte,t0=performance.now(),d=900;
    const pas=t=>{const f=Math.min(1,(t-t0)/d);el.textContent=Math.round(cible*(1-Math.pow(1-f,3)));if(f<1)requestAnimationFrame(pas)};requestAnimationFrame(pas)});
  bruit('piece');
  if(b.dataset.fete){setTimeout(()=>bruit('fanfare'),350);confettis()}
}
function confettis(){
  const zone=$('#rapport'),coul=['#D63A2F','#E9A93A','#3F7CB8','#5E9E4A','#8A5AA8','#FFF7E4'];
  for(let k=0;k<46;k++){const c=document.createElement('i');c.className='confetti';
    c.style.cssText=`left:${Math.random()*100}%;background:${coul[k%coul.length]};animation-delay:${(Math.random()*.4).toFixed(2)}s;animation-duration:${(1.6+Math.random()*1.2).toFixed(2)}s;--d:${(Math.random()*120-60).toFixed(0)}px;--r:${(Math.random()*720-360).toFixed(0)}deg`;
    zone.appendChild(c);setTimeout(()=>c.remove(),3400)}
}

  if(t.dataset.hangar){ecran='hangar';return tout()}

// Boucle : comptes à rebours + fin de mission + fin des récupérations (y compris celles terminées app fermée)
function notifierFinMission(m){
  const r=m.resultat;
  if(r.survie){notifier('Jimee de retour',`Mission terminée sur ${m.nomPlanete}. Le rapport vous attend.`);return}
  notifier('⚠️ Votre Jimee ne répond plus',`Signal perdu sur ${m.nomPlanete}. Le rapport vous attend.`);
  const nb=objetsEquipes(etat.jimee).length;
  if(nb)notifier('🎒 Équipement resté sur la planète',`${nb} équipement${nb>1?'s sont restés':' est resté'} sur ${m.nomPlanete}.`);
}
function tic(){
  const m=etat.mission;let change=false;
  if(m&&Date.now()>=m.fin&&!m.notifie){m.notifie=true;notifierFinMission(m);change=true}
  if(finaliserRecuperations())change=true;
  if(finaliserExpeditions())change=true;
  if(finaliserVoyage())change=true;
  if(multiActif()&&!document.hidden)synchroniser();
  if(finaliserAtelier())change=true;
  if(majContrats())change=true;
  if(change)tout(); else {dessinerStatut();if(ecran==='atelier')majFileAtelier()}
}
