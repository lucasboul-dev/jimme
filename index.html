      c.blesser();const perte=c.perdre(r.int(1,2));return c.dit(h,'mauvais',`${J} tient tête à un dragon de feu mais finit brûlé (endurance −1)${perte?` et perd ${perte}`:''}.`);
    }
    const cr=r.int(10,25);c.credits(cr);c.etat.exploits.dragon++;
    c.dit(h,'bon',`${J} tient tête à un dragon de feu, qui finit par renoncer en laissant ${cr} crédits de dégâts… à son avantage, pour une fois.`);
    c.ajouterEnSilence(h,'ecaille',c.qte('ecaille'),`Sur le sol brûlé, ${J} ramasse`);
  }},
  nid_dragon:{nom:'Nid de dragon',risque:true,executer(c,h){
    const {J,a,r}=c,N=EPREUVES.nid;
    if(a('froussard'))return c.dit(h,'neutre',`${J} aperçoit un nid de dragon rempli de trésors… et décide que non.`);
    const perc=c.s.perception+(a('pisteur')?3:0)-(a('bavard')?2:0),requis=Math.round(c.niveau*N.requis);
    // Prudence : comme au donjon, il ne tente sa chance que s'il se sait assez discret
    if(perc<requis)return c.dit(h,'neutre',`${J} observe un nid de dragon gardé de près et juge qu'il ne passera pas inaperçu (perception ${perc}, il faudrait ${requis}). Il s'éloigne à pas de loup.`);
    if(r.chance(c.palier(perc-requis))){
      if(c.mortel(N.mort))return c.mourir(h,`${J} se glisse dans un nid de dragon. La mère était à la maison. Signal perdu.`);
      c.blesser();return c.dit(h,'mauvais',`${J} se fait repérer en fouillant un nid de dragon et s'enfuit, roussi (endurance −1). Aucun butin.`);
    }
    const cr=r.int(20,45);c.credits(cr);const o=c.objet();
    c.dit(h,'bon',`${J} se faufile dans un nid de dragon pendant la sieste de la propriétaire : ${cr} crédits et ${c.lib(o)}.`);
    if(r.chance(.5))c.ajouterEnSilence(h,'ecaille',c.qte('ecaille'),`Dans le nid, ${J} ramasse aussi`);
    if(r.chance(ATELIER.dropPlan.nid))c.plan();
  }},
  essaim:{nom:'Essaim',risque:true,executer(c,h){
    const {J,a,r,util:{oxy}}=c,E=EPREUVES.essaim;
    if(c.consommer('appat'))return c.dit(h,'bon',`${J} lance un appât au loin : l'essaim d'insectes géants change de cap.`);
    if(!r.chance(c.palier(c.s.perception+(a('pisteur')?3:0)-Math.round(c.niveau*E.reperage))))return c.dit(h,'bon',`${J} entend un bourdonnement grave au loin et fait un large détour : un essaim d'insectes géants.`);
    let p=c.palier(c.s.endurance-Math.round(c.niveau*E.requis));if(oxy)p*=facteurOxygene(oxy.niveau);if(a('allergique'))p=Math.min(.95,p*1.5);
    if(r.chance(p)){
      if(c.mortel(E.mort)&&!c.consommer('antidote','L\'antidote fait effet in extremis : le venin est neutralisé.'))return c.mourir(h,`Un essaim d'insectes géants s'abat sur ${J}. Signal perdu.`);
      c.blesser();return c.dit(h,'mauvais',`${J} traverse un essaim d'insectes géants en agitant les bras. Il ressort couvert de piqûres (endurance −1).`);
    }
    c.dit(h,'neutre',`Un essaim d'insectes géants tourne autour de ${J}, qui serre les dents et passe${oxy?', masque sur le nez':''}.`);
    if(r.chance(.5))c.ajouterEnSilence(h,'chitine',c.qte('chitine'),`Derrière l'essaim, ${J} ramasse des carapaces abandonnées :`);
  }},
  mirage:{nom:'Mirage',executer(c,h){
    const {J,r}=c;
    if(c.util.boussole||c.s.perception>=Math.round(c.niveau*.5))return c.dit(h,'neutre',`${J} aperçoit une oasis à l'horizon, plisse les yeux (perception ${c.s.perception}) et n'y croit pas une seconde. Bien vu : c'était un mirage.`);
    c.sauter(1);c.dit(h,'mauvais',`${J} court vers une magnifique oasis… qui recule à chaque pas. C'était un mirage. Il perd un temps fou à revenir.`);
  }},
  avalanche:{nom:'Avalanche',risque:true,executer(c,h){
    const {J,r}=c,P=EPREUVES.avalanche,eff=c.s.agilite+(c.o('piolet')?2:0)-(c.a('maladroit')?1:0);
    if(r.chance(c.palier(eff-Math.round(c.niveau*P.requis)))){
      if(c.mortel(P.mort))return c.mourir(h,`Un grondement sourd, puis une vague blanche : l'avalanche emporte ${J}. Signal perdu.`);
      c.blesser();const perte=c.perdre(r.int(1,2));return c.dit(h,'mauvais',`${J} est rattrapé par une avalanche et s'extrait de la neige, contusionné (endurance −1)${perte?`, sans ${perte}`:''}.`);
    }
    c.dit(h,'neutre',`Une avalanche dévale la pente : ${J} plonge derrière un rocher${c.o('piolet')?', planté sur son piolet,':''} et la regarde passer.`);
  }},
  eruption:{nom:'Éruption',risque:true,executer(c,h){
    const {J,r}=c,P=EPREUVES.eruption;
    if(r.chance(c.palier(c.s.endurance-Math.round(c.niveau*P.requis)))){
      if(c.mortel(P.mort*(c.o('ignifuge')?.5:1)*(c.set('volcanologue')>=4?.5:1)))return c.mourir(h,`Un volcan entre en éruption juste au-dessus de ${J}. Signal perdu.`);
      c.blesser();return c.dit(h,'mauvais',`${J} fuit une éruption sous une pluie de cendres brûlantes (endurance −1).`);
    }
    if(r.chance(.4))return c.ajouterEnSilence(h,'obsidienne',c.qte('obsidienne'),`${J} s'abrite d'une éruption puis ramasse, encore tiède,`);
    c.dit(h,'neutre',`Un volcan crache des cendres au loin ; ${J} presse le pas.`);
  }},
  reflets:{nom:'Reflets aveuglants',risque:true,executer(c,h){
    const {J,r}=c,P=EPREUVES.reflets,eff=c.s.perception+(c.o('visiere')?3:0)+(c.o('nocturne')?1:0);
    if(r.chance(c.palier(eff-Math.round(c.niveau*P.requis)))){
      if(c.mortel(P.mort))return c.mourir(h,`Aveuglé par les reflets des cristaux, ${J} ne voit pas le vide devant lui. Signal perdu.`);
      c.blesser();return c.dit(h,'mauvais',`Ébloui par des milliers de facettes, ${J} s'écorche sur les arêtes des cristaux (endurance −1).`);
    }
    c.dit(h,'neutre',`${J} traverse une forêt de cristaux qui renvoient la lumière dans tous les sens${c.o('visiere')?', tranquille derrière sa visière polarisée':' en plissant les yeux'}.`);
  }},
  drones:{nom:'Drones gardiens',risque:true,executer(c,h){
    const {J,r}=c,P=EPREUVES.drones,intel=c.s.intelligence+(c.o('cable')?3:0);
    if(!r.chance(c.palier(intel-Math.round(c.niveau*P.intel)))){const cr=r.int(5,15);c.credits(cr);if(r.chance(ATELIER.dropPlan.epave))c.plan();
      return c.dit(h,'bon',`Des drones gardiens repèrent ${J}, qui pirate leur réseau (intelligence ${intel}) et vide la petite caisse de la sécurité : ${cr} crédits.`)}
    if(r.chance(c.palier(c.s.agilite-Math.round(c.niveau*P.agi)))){
      if(c.mortel(P.mort))return c.mourir(h,`Des drones gardiens encerclent ${J}. Ils n'ont pas de bouton « pause ». Signal perdu.`);
      c.blesser();return c.dit(h,'mauvais',`${J} échoue à pirater des drones gardiens et s'enfuit sous leurs tirs (endurance −1).`);
    }
    c.dit(h,'neutre',`${J} n'arrive pas à pirater des drones gardiens, mais leur échappe en zigzaguant entre les ruines.`);
  }},
  champignons:{nom:'Spores hallucinogènes',executer(c,h){
    const {J,r}=c;
    if(c.o('masque'))return c.dit(h,'neutre',`Des champignons géants libèrent un nuage de spores ; ${J}, derrière son masque filtrant, n'en respire pas une.`);
    if(c.s.volonte>=Math.round(c.niveau*EPREUVES.champignons.requis))return c.dit(h,'neutre',`Des spores hallucinogènes font danser les arbres autour de ${J}, qui se concentre (volonté ${c.s.volonte}) et garde le cap.`);
    const perte=c.perdre(r.int(0,2));
    c.dit(h,'mauvais',`${J} respire des spores hallucinogènes et passe une heure à discuter avec un champignon très cultivé${perte?`. Il lui offre ${perte}`:''}.`);
  }},
  chasse:{nom:'Chasse',executer(c,h){
    const {J,r}=c,eff=Math.max(c.s.force,c.s.agilite)+(c.o('harpon')?2:0)+(c.o('machette')?2:0)+(c.a('dresseur')?-99:0);
    if(c.a('dresseur'))return c.dit(h,'neutre',`${J} croise un troupeau, refuse de chasser des créatures aussi mignonnes et leur gratte le menton à la place. Dresseur.`);
    if(eff>=Math.round(c.niveau*EPREUVES.chasse.requis))return c.ajouterEnSilence(h,'cuir',c.qte('cuir'),`${J} chasse une bête de la région et récupère`);
    if(c.planete.faune.predateurs&&r.chance(.3)){c.blesser();return c.dit(h,'mauvais',`${J} tente de chasser, mais c'est la proie qui le chasse (endurance −1).`)}
    c.dit(h,'neutre',`${J} poursuit une bête pendant une heure, puis abandonne, essoufflé.`);
  }},
  retour:{nom:'Retour',executer(c,h){
    collecteTerrain(c,h);
    if(incidentRetour(c,h))return;
    c.dit(h,'bon',`${c.J} rejoint sa capsule et décolle vers le vaisseau.`);
  }}
};
// Tables dérivées du registre (utilisées par le générateur de planètes et le simulateur)
const ETAPES_NOMS=Object.fromEntries(Object.entries(EVENEMENTS).map(([id,e])=>[id,e.nom]));
const ETAPES_RISQUEES=new Set(Object.keys(EVENEMENTS).filter(id=>EVENEMENTS[id].risque));

/* =========================================================
   10. SIMULATION : toute la mission est calculée à l'envoi
   ========================================================= */
function simuler(planete,jimee,seed){
  const r=creerRng(seed);
  const cap=emplacementsSac(jimee), T=SAC.tailleStack;
  const ev=[], cargaison={}, objets=[], perdusEnRoute={}, laisses=[], consommes=[], plansTrouves=[];
  const trouves={}, pertes=[], influences=new Map();   // V14 : découvert / perdu (par cause) / ce qui a pesé sur le résultat
  const dispo={};for(const id of (jimee.ceinture||[]))dispo[id]=(dispo[id]||0)+1;
  const etatM={credits:0,mortH:null,causeMort:null,sauter:0,blessures:0,idCourant:null};
  const tableRes=ressourcesPlanete(planete);
  const c={
    r, planete, cargaison, perdusEnRoute, etat:etatM, J:jimee.nom, jimee,
    a:t=>jimee.talents.includes(t),
    s:statsEffectives(jimee),
    // Effets propres des objets équipés (E1) et caractéristiques de la planète (lot 1)
    o:(()=>{const set=new Set(objetsEquipes(jimee).map(specialObjet).filter(Boolean));return id=>set.has(id)})(),
    p:id=>planete.climat.id===id||planete.particularites.includes(id),
    notes:[],
    // V14 : une perte = {cause, talent, ressources}. Causes : 'sac' (plein), 'route:<étape>', 'gache' (récolte gâchée), 'incident' (au retour)
    perte(cause,talent,stock,info){if(!stock||!Object.values(stock).some(q=>q>0))return;let e=pertes.find(x=>x.cause===cause&&x.talent===talent);
      if(!e){e={cause,talent,ressources:{},...(info||{})};pertes.push(e)}for(const [id,q] of Object.entries(stock))if(q>0)e.ressources[id]=(e.ressources[id]||0)+q},
    gacher(id,q,talent){if(!id||!(q>0))return;trouves[id]=(trouves[id]||0)+q;c.perte('gache',talent,{[id]:q})},
    influence(id,txt){if(!influences.has(id))influences.set(id,txt)},
    // Consommable de la ceinture : utilisé une fois, au bon moment
    consommer(id,texte){if(!(dispo[id]>0))return false;dispo[id]--;consommes.push(id);if(texte)c.notes.push(texte);return true},
    // Plan de fabrication trouvé (scanné : ne prend pas de place dans le sac)
    plan(){const max=ATELIER.paliersParClasse[planete.classe]||1,pool=RECETTES.filter(x=>!x.connu&&x.palier<=max);if(!pool.length)return;
      const p=r.pick(pool);plansTrouves.push(p.id);c.notes.push(`${jimee.nom} scanne un plan de fabrication : ${nomProduit(p)}.`)},
    niveau:niveauBase(planete.danger),
    lave:planete.particularites.includes('lave'),
    util:{oxy:effetUtil(jimee,'oxygene'),bouee:effetUtil(jimee,'bouee')||effetUtil(jimee,'scaphandre'),corde:effetUtil(jimee,'corde'),thermos:effetUtil(jimee,'thermos'),
      boussole:effetUtil(jimee,'boussole'),comete:objetsEquipes(jimee).some(o=>o.nom==='Bottes de la Comète'),
      lampe:effetUtil(jimee,'lampe'),detecteur:effetUtil(jimee,'detecteur'),drone:effetUtil(jimee,'drone'),scaphandre:effetUtil(jimee,'scaphandre'),gourde:effetUtil(jimee,'gourde')},
    // Sets : nombre de pièces portées
    set:(()=>{const sp=setsPortes(jimee);return id=>sp[id]||0})(),
    dit:(h,ton,txt)=>ev.push({h,ton,txt,id:etatM.idCourant}),   // V26 : id de l'étape (vignette du rapport animé)
    // V13 : écart de classe effectif (planète − Jimee, réduit par l'équipement)
    ecart:ecartEffectif(planete,jimee),
    palier:marge=>palier(marge-malusMarge(c.ecart)),
    mortel:base=>r.chance(Math.min(EPREUVES.mortMax,partMortelle(base*(planete.carto?EPREUVES.cartographie.reduction:1),planete.classe)*facteurEcart(c.ecart))),
    // V13 : stock d'équipements de la planète (undefined = illimité, ex. simulations du Labo)
    stockVide:()=>planete.stockRestant!==undefined&&(etatM.objetsTrouves||0)>=planete.stockRestant,
    lib:(o,court)=>o?(court?`${o.nom} (niv. ${o.niveau})`:`${o.nom} (niv. ${o.niveau}, classe ${o.rarete})`):'rien du tout : il n\'y a plus aucun équipement à trouver sur cette planète',
    mourir(h,txt){
      if(c.a('increvable')&&!etatM.increvable){etatM.increvable=true;etatM.blessures++;c.s.endurance=Math.max(0,c.s.endurance-1);
        ev.push({h,ton:'mauvais',txt:txt.replace(/ ?Signal perdu\.?/,'')+` … mais ${jimee.nom} se relève, couvert de bleus. Increvable (endurance −1).`,id:etatM.idCourant});return}
      etatM.mortH=h;etatM.causeMort=etatM.idCourant;ev.push({h,ton:'mort',txt,id:etatM.idCourant})},
    blesser(endu=true){
      if(c.consommer('trousse','Trousse de soin utilisée : la blessure est soignée sur place.'))return;
      etatM.blessures++;
      if(endu&&c.o('carton')&&!etatM.carton){etatM.carton=true;c.notes.push('Son casque en carton renforcé encaisse le choc : endurance préservée.');return}
      if(endu)c.s.endurance=Math.max(0,c.s.endurance-1)},
    sauter:k=>{etatM.sauter=Math.max(etatM.sauter,k)},
    credits:n=>{etatM.credits=Math.max(0,etatM.credits+n)},
    // Un objet trouvé prend un emplacement ; sac plein = l'objet reste sur place (signalé juste après l'étape)
    objet(){if(c.stockVide())return null;etatM.objetsTrouves=(etatM.objetsTrouves||0)+1;const o=tirerObjet(r,c.a('chanceux'),planete.speciale,planete.classe,planete.biome.id);
      if(planete.zone==='riche'&&o.niveau<CONFIG.niveauMaxObjet){o.niveau++;if(o.stat)o.bonus=bonusDeNiveau(o.niveau,o.rarete)+(o.bonusPlus||0)}
      if(c.p('aurores')&&r.chance(EPREUVES.aurores.charge)&&o.niveau<CONFIG.niveauMaxObjet){o.niveau++;if(o.stat)o.bonus=bonusDeNiveau(o.niveau,o.rarete);c.notes.push(`Chargé par les aurores, ${o.nom} gagne un niveau (niv. ${o.niveau}).`)}
      if(SAC.objetsPrennentUnEmplacement&&emplacementsOccupes(cargaison,objets.length)>=cap)laisses.push(o);else objets.push(o);return o},
    libres:()=>Math.max(0,cap-emplacementsOccupes(cargaison,objets.length)),
    tirer(extraction,raretes){
      const pool=Object.entries(tableRes).filter(([id,p])=>p>0&&RES[id]&&RES[id].extraction===extraction&&(!raretes||raretes.includes(RES[id].rarete))).map(([id,poids])=>({id,poids}));
      return pool.length?r.pondere(pool).id:null;
    },
    qte(id){const [a,b]=RARETES_RESSOURCE[RES[id].rarete].qte;const q=Math.max(1,Math.round(r.int(a,b)*(RENDEMENT.multRarete[RES[id].rarete]||1)*MULT_RESSOURCES_CLASSE[planete.classe]*(planete.zone?EPREUVES.zones[planete.zone].ressources:1)))+(SETS.some(st=>st.biomes.includes(planete.biome.id)&&c.set(st.id)>=4)?1:0);return id==='glace'&&c.p('chaud')?Math.ceil(q/2):q},
    // Place restante pour une ressource = le reste de ses stacks entamés + les emplacements libres × tailleStack
    ajouter(id,q){const cur=cargaison[id]||0,dansStacks=cur?Math.ceil(cur/T)*T-cur:0;
      const pris=Math.min(q,dansStacks+c.libres()*T);if(pris)cargaison[id]=cur+pris;
      if(q>0)trouves[id]=(trouves[id]||0)+q;if(pris<q)c.perte('sac',null,{[id]:q-pris});return pris},
    // V14 : comme ajouter, mais le surplus n'est ni « trouvé » ni « perdu » (collecte en chemin : il arrête de ramasser)
    ajouterSiPlace(id,q){const cur=cargaison[id]||0,dansStacks=cur?Math.ceil(cur/T)*T-cur:0;
      const pris=Math.min(q,dansStacks+c.libres()*T);if(pris){cargaison[id]=cur+pris;trouves[id]=(trouves[id]||0)+pris}return pris},
    // Raconte une récolte en tenant compte de la place restante dans le sac
    recolter(h,id,q,intro,suffixe){
      const pris=c.ajouter(id,q), n=RES[id].nomMin;
      if(pris===0)c.dit(h,'mauvais',`${intro}, mais son sac est plein (${cap} emplacements occupés). Il laisse tout sur place, le cœur lourd.`);
      else if(pris<q)c.dit(h,'bon',`${intro} : ${q} unités ${de(n)} disponibles, il n'en emporte que ${pris}, faute de place dans son sac (${cap} emplacements).${suffixe}`);
      else c.dit(h,'bon',`${intro} : +${q} ${n}.${suffixe}`);
      return pris;
    },
    // Variante pour une trouvaille au détour d'un autre événement : « <intro> 3 unités de soufre. »
    ajouterEnSilence(h,id,q,intro){
      const pris=c.ajouter(id,q), quoi=`${q} unité${q>1?'s':''} ${de(RES[id].nomMin)}`;
      if(pris===0)c.dit(h,'mauvais',`${intro} ${quoi}, mais son sac est plein : il doit tout laisser.`);
      else if(pris<q)c.dit(h,'bon',`${intro} ${quoi} et n'en garde que ${pris}, faute de place.`);
      else c.dit(h,'bon',`${intro} ${quoi}.`);
      return pris;
    },
    perdre(n){
      const perdu={};
      for(let k=0;k<n;k++){
        const dispo=Object.entries(cargaison).filter(([,q])=>q>0).map(([id,q])=>({id,poids:q}));
        if(!dispo.length)break;
        const id=r.pondere(dispo).id;cargaison[id]--;perdu[id]=(perdu[id]||0)+1;perdusEnRoute[id]=(perdusEnRoute[id]||0)+1;
      }
      c.perte('route:'+(etatM.idCourant||'?'),null,perdu);
      return listeRessourcesTexte(perdu);
    }
  };
  // J10 : origine — le Jimee est chez lui sur son biome natal
  if(jimee.origine===planete.biome.id){c.s.endurance++;c.s.perception++;c.notes.push(`${jimee.nom} reconnaît les paysages de son monde natal : endurance et perception +1.`)}
  // Brouillard : perception réduite pour toute la mission (sauf lampe frontale)
  if(c.p('brouillard')&&!c.util.lampe){c.s.perception=Math.max(0,c.s.perception-EPREUVES.brouillard.malusPerception);c.notes.push(`Un brouillard épais enveloppe ${jimee.nom} : perception −${EPREUVES.brouillard.malusPerception}.`)}
  // P6 : un Dresseur peut se faire un compagnon
  if(c.a('dresseur')&&['herbivores','predateurs','dragons'].includes(planete.faune.id)&&r.chance(.5)){const st=r.pick(['force','agilite','perception']);c.s[st]++;
    c.notes.push(`Une créature locale se prend d'affection pour ${jimee.nom} et l'accompagne : ${STATS_NOMS[st].toLowerCase()} +1 pour la mission.`)}
  // Consommables actifs dès le départ
  if(c.consommer('ration'))c.s.endurance+=1;
  if(c.consommer('stimulant'))c.s.volonte+=2;
  etatM.exploits={donjon:0,dragon:0,gardien:0};etatM.gardienRencontre=false;
  const n=planete.etapes.length;
  for(let i=0;i<n&&etatM.mortH===null;i++){
    if(etatM.sauter>0){etatM.sauter--;continue}
    const id=planete.etapes[i], evt=EVENEMENTS[id];
    const h=i===0?0:i===n-1?12:Math.max(.2,Math.min(11.8,(i/(n-1))*12+(r.f()-.5)*.8));
    if(id==='retour'&&planete.gardien&&etatM.mortH===null){etatM.idCourant='gardien';gardienLegendaire(c,h);if(etatM.mortH!==null)break}
    etatM.idCourant=id;

/* =========================================================
   11. RÉCUPÉRATION : les 3 jets, calculés UNE SEULE FOIS au lancement
   ========================================================= */
const prixAgence=(ag,objets)=>ag.prix.base+ag.prix.parNiveau*objets.reduce((s,o)=>s+o.niveau,0);
const chanceObjet=(o,ag,bonusBalise=0)=>Math.min(100,(RECUP.chanceObjetParNiveau[o.niveau]??RECUP.chanceObjetParNiveau[CONFIG.niveauMaxObjet])+ag.bonusObjet+bonusBalise);
// Pur et déterministe : mêmes objets + même agence + même seed = même résultat.
function resoudreRecuperation(objets,niveauAgence,seed,bonusBalise=0){
  const ag=agence(niveauAgence), r=creerRng(seed);
  const tous=objets.map(o=>o.id);
  // Jet 1 : l'équipe revient-elle ?
  const jetRetour=r.int(1,100);
  const phrase=r.int(0,ag.succes.length-1);
  if(jetRetour>ag.retour){
    return {succes:false,jetRetour,seuilRetour:ag.retour,part:null,nbTentes:0,essais:[],recupereIds:[],perduIds:[],nonTenteIds:tous,phrase};
  }
  // Jet 2 : un seul tirage pondéré pour la part de slots tentés (tranches mutuellement exclusives)
  const tranche=r.pondere(ag.tranches);
  const nbTentes=Math.min(objets.length,Math.ceil(objets.length*tranche.part-1e-9));
  // Sélection automatique et aléatoire des objets tentés (le joueur ne choisit pas)
  const tentes=r.melanger(objets).slice(0,nbTentes);
  // Jet 3 : un jet par objet, selon son niveau + bonus d'agence
  const essais=tentes.map(o=>{const chance=chanceObjet(o,ag,bonusBalise);const jet=r.int(1,100);return {id:o.id,chance,jet,ok:jet<=chance}});
  const tenteIds=new Set(tentes.map(o=>o.id));
  return {succes:true,jetRetour,seuilRetour:ag.retour,part:tranche.part,nbTentes,essais,
    recupereIds:essais.filter(e=>e.ok).map(e=>e.id),perduIds:essais.filter(e=>!e.ok).map(e=>e.id),
    nonTenteIds:tous.filter(id=>!tenteIds.has(id)),phrase};
}

      const k=graine+'/'+gid+'/'+pid;neuf[k]=Math.max(neuf[k]||0,v);if(champ==='cartographie')rapport.push(k);

  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(reg=>reg.showNotification(titre,{body:corps,icon:'icon-192.png'}));
  else try{new Notification(titre,{body:corps})}catch(e){}

// ntfy n'accepte que de l'ASCII dans les en-têtes : le titre est envoyé sans emoji, l'emoji passe par les tags.
function programmerNtfy(titre,corps,delai,tag){
  const t=(etat.params.ntfy||'').trim(); if(!t)return;
  fetch('https://ntfy.sh/'+encodeURIComponent(t),{method:'POST',
    headers:{'Title':titre.normalize('NFD').replace(/[^\x20-\x7E]/g,'').trim(),'Delay':delai,'Tags':tag||'rocket'},
    body:corps}).catch(()=>{});
}

// Durée normale = celle du réacteur (12 h au niveau 1, comme CONFIG.dureeMissionMs) ; le mode test garde 30 s
// V14 : durée d'exploration d'une planète (heures sur place) et durée réelle de la mission (réacteur compris).
// Elle suit la TAILLE (étapes tirées pour la taille), pas les épreuves ajoutées par le plancher de dangerosité.
function dureeExplorationH(p,brute){
  if(p.dureeH)return p.dureeH;
  const n=p.etapesTaille??Math.max(0,p.etapes.length-2),f=Math.max(0,Math.min(1,(n-DUREE.etapesMin)/(DUREE.etapesMax-DUREE.etapesMin)));
  let h=DUREE.minH+f*(DUREE.maxH-DUREE.minH);
  if(!brute&&gardienConnuSur(p))h=Math.min(DUREE.maxSpecialeH,h*(1+DUREE.bonusGardien));
  return Math.round(h/DUREE.arrondiH)*DUREE.arrondiH;
}
// Le détour par le gardien ne rallonge la mission qu'une fois qu'on sait qu'il est là, et tant qu'il est vivant
const gardienConnuSur=p=>!!(p&&p.speciale&&etat.bossVus&&etat.bossVus[cleGal()]==='vu');
const dureeMissionH=p=>Math.max(DUREE.minH,Math.round(dureeExplorationH(p)*reacteur().facteur/DUREE.arrondiH)*DUREE.arrondiH);
const fmtDuree=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);if(!hh)return `${mm} min`;return mm?`${hh} h ${String(mm).padStart(2,'0')}`:`${hh} h`};
const dureeMission=p=>etat.params.test?CONFIG.dureeMissionTestMs:dureeMissionH(p)*3600*1000;
const texteDureeMission=p=>{if(etat.params.test)return '30 secondes (mode test)';const e=dureeExplorationH(p),m=dureeMissionH(p);
  return m<e?`${fmtDuree(m)} (exploration ${fmtDuree(e)}, raccourcie par le réacteur)`:fmtDuree(m)};
// V20 : bloc repliable générique (titre visible, détail au toucher)

const nomTaille=id=>(TAILLES.find(t=>t.id===id)||{nom:'Inconnue'}).nom;
const dureeRecup=()=>etat.params.test?RECUP.dureeTestMs:RECUP.dureeMs;

const rangRequisClasse=id=>id==='S'?REPUTATION.classeS:id==='A'?REPUTATION.classeA:id==='B'?REPUTATION.classeB:0;
function recruter(classe='G'){
  const cl=classeJimee(classe);
  if(!cl||etat.jimee||etat.credits<cl.prix||rangCorp()<rangRequisClasse(cl.id))return;
  etat.credits-=cl.prix;
  etat.jimee=genererJimee('JIMEE/'+Date.now()+'/'+Math.random(),cl.id);
  dire({G:`Contrat signé avec ${etat.jimee.nom}. La Jimee's Corp décline toute responsabilité.`,
        B:`${etat.jimee.nom} (classe B) rejoint le vaisseau avec son certificat de stage. Il est plastifié.`,
        F:`${etat.jimee.nom} (classe F) embarque. Il a lu la première ligne du mode d'emploi, ce qui le place déjà dans le haut du panier.`,
        A:`${etat.jimee.nom} (classe A) monte à bord. Il a demandé où était le spa. Il n'y a pas de spa.`,
        S:`${etat.jimee.nom} (classe S) monte à bord sans un regard pour personne. Il a déjà rédigé son propre éloge funèbre, au cas où.`}[cl.id]||`Contrat signé avec ${etat.jimee.nom}.`);
  bruit('fanfare');
  if(etat.guide)ecran='vaisseau'; else {ecran='jimee'; jimeeStatsSeules=false}   // V26 : pendant le guide, on voit le Jimee s'installer à bord
  tout();
}

function vendreRessource(id){
  const q=etat.ressources[id];if(!q||!RES[id])return;
  const g=q*prixVente(id);baisserPrix(id,q);etat.credits+=g;delete etat.ressources[id];
  dire(`La Corp rachète ${q} ${RES[id].nomMin} pour ${g} crédits. Elle le revendra trois fois plus cher.`);tout();
}
function vendreTout(){
  const q=totalRessources(etat.ressources);if(!q)return;
  let g=0;for(const [id,n] of Object.entries(etat.ressources)){g+=n*prixVente(id);baisserPrix(id,n)}etat.credits+=g;etat.ressources={};
  dire(`La Corp rachète toute la soute (${q} unités) pour ${g} crédits. Le comptable de la Corp sourit, ce qui n'est jamais bon signe.`);tout();
}

const prixAchat=id=>Math.ceil(RES[id].prix*(typeof multMarche==='function'&&etat.marcheVivant?Math.max(1,multMarche(id)):1)*MARCHE.multiplicateurAchat*(rangCorp()>=REPUTATION.remiseMarche?REPUTATION.remise:1));
const prixCarburant=()=>BOUTIQUE_TEST.carburantGratuit?0:CARBURANT.prixUnite;
function vendreQuantite(id,qte){
  const q=Math.min(Math.floor(qte),etat.ressources[id]||0);if(!(q>0)||!RES[id])return;
  const g=q*prixVente(id);baisserPrix(id,q);etat.credits+=g;etat.ressources[id]-=q;if(etat.ressources[id]<=0)delete etat.ressources[id];
  dire(`Vendu : ${q} ${RES[id].nomMin} pour ${g} crédits. La Corp le revendra ${MARCHE.multiplicateurAchat} fois plus cher, c'est de bonne guerre.`);tout();
}
function acheterRessource(id,qte){
  if(!RES[id])return;
  const p=prixAchat(id),q=Math.min(Math.floor(qte),Math.floor(etat.credits/p));if(!(q>0))return;
  etat.credits-=q*p;etat.ressources[id]=(etat.ressources[id]||0)+q;
  dire(`Livraison en soute : ${q} ${RES[id].nomMin} pour ${q*p} crédits. Le service client vous remercie pour votre générosité.`);tout();
}
// Achète d'un coup toutes les ressources qui manquent pour la prochaine amélioration d'une pièce
const coutManquant=quoi=>Object.entries(ressourcesManquantes(quoi)).reduce((s,[id,q])=>s+q*prixAchat(id),0);
function acheterManquant(quoi){
  const m=ressourcesManquantes(quoi),total=coutManquant(quoi);
  if(!total||etat.credits<total)return;
  etat.credits-=total;for(const [id,q] of Object.entries(m))etat.ressources[id]=(etat.ressources[id]||0)+q;
  dire(`Achat express : ${listeRessourcesTexte(m)} pour ${total} crédits. Livré directement au hangar, facture scotchée dessus.`);tout();
}

function equiper(idObj,slotId){
  const j=etat.jimee;if(!j||etat.mission)return;
  const i=etat.inventaire.findIndex(o=>o.id===idObj);if(i<0)return;
  const o=etat.inventaire[i];
  const compatibles=SLOTS.filter(s=>s.accepte===o.emplacement);
  const slot=(slotId&&compatibles.find(s=>s.id===slotId))||compatibles.find(s=>!j.equipement[s.id])||compatibles[0];
  if(!slot)return;
  etat.inventaire.splice(i,1);
  if(j.equipement[slot.id])etat.inventaire.push(j.equipement[slot.id]);
  j.equipement[slot.id]=o;
  dire(`${j.nom} s'équipe de ${o.nom} (${slot.nom.toLowerCase()}).`);tout();
}
function retirer(slotId){
  const j=etat.jimee;if(!j||etat.mission||!j.equipement[slotId])return;
  const o=j.equipement[slotId];j.equipement[slotId]=null;etat.inventaire.push(o);
  dire(`${o.nom} retourne en soute.`);tout();
}

// P23 + P21 : la planète telle que le Jimee la vivra (zone d'atterrissage choisie, cartographie)
let zoneAtterrissage='standard';
// V16 : correctif. La clé contenait la graine de l'univers + l'identifiant de la planète (P0 à P7), mais PAS la galaxie :
// la planète P3 de toutes les galaxies partageait la même cartographie et le même stock d'équipements. Clé = univers/galaxie/planète.
const cleCarto=p=>etat.params.galaxie+'/'+etat.galaxieActuelle+'/'+p.id;
const cleGal=()=>etat.params.galaxie+'/'+etat.galaxieActuelle;   // V20 : gardien repéré, par galaxie
const stockRestant=(p,avecCache)=>Math.max(0,(p.stockEquipements||0)+(avecCache?(p.stockCache||0):0)-((etat.equipementsPris||{})[cleCarto(p)]||0));
// V18 : équipement spécial porté qui correspond à l'astre de la planète (ex. détecteur infrarouge sous un trou noir)
const equipementSpecialPorte=(p,j)=>{const A=p.astre&&ASTRES[p.astre];return A&&A.equipement&&j&&effetUtil(j,A.equipement)?A.equipement:null};
function planeteEffective(p){
  const z=EPREUVES.zones[zoneAtterrissage]||EPREUVES.zones.standard,carto=(etat.cartographie[cleCarto(p)]||0)>=EPREUVES.cartographie.missions;
  const eqs=equipementSpecialPorte(p,etat.jimee);
  if(zoneAtterrissage==='standard'&&!carto&&!eqs)return p;
  return {...p,danger:Math.max(0,Math.min(100,p.danger+z.danger)),zone:zoneAtterrissage==='standard'?null:zoneAtterrissage,carto,equipementSpecial:eqs};
}
function envoyer(){
  const p=galaxie.planetes.find(x=>x.id===selection);
  if(!p||!etat.jimee||etat.mission||etat.voyage)return;   // V18 : pas de mission pendant un voyage
  etat.compteur++;
  const seed=`${p.seed}|${etat.jimee.id}|${etat.compteur}`;
  const tombes=etat.memorial.filter(x=>x.planeteId===p.id&&x.type==='mort'&&(x.galaxie?x.galaxie===etat.galaxieActuelle:x.planete===p.nom)).map(x=>x.nom);
  const pe=planeteEffective(p);
  pe.stockRestant=stockRestant(p,!!pe.equipementSpecial);   // V13 (V18 : + stock caché avec l'équipement requis) : la planète ne contient qu'un nombre limité d'équipements
  if(p.speciale&&gardienDansGalaxie()&&!etat.gardiensVaincus.includes(etat.galaxieActuelle)){pe.gardien=true;const dispo=LEGENDAIRES.map(x=>x.nom).filter(n=>n!=='Couronne du Premier Jimee'&&!etat.legendairesObtenus.includes(n));pe.legendaireDispo=dispo.length?dispo[(etat.compteur*7)%dispo.length]:null}
  const resultat=simuler(tombes.length?{...pe,tombes}:pe,etat.jimee,seed); // le jeu connaît déjà la fin
  const maint=Date.now();
  const dureeH=dureeMissionH(p);
  const colis=etat.contrats.actifs.find(c=>c.type==='colis');
  zoneAtterrissage='standard';
  const express=missionExpress();   // V26 : première mission guidée, raccourcie
  etat.mission={planeteId:p.id,cleCarto:cleCarto(p),nomPlanete:p.nom,classe:p.classe,biome:p.biome.id,depart:maint,fin:maint+(express?GUIDE.missionExpressMs:dureeMission(p)),dureeH,resultat,notifie:false,colis:colis?colis.id:null,express};
  dire(express?`${etat.jimee.nom} décolle vers ${p.nom}. Mission express offerte par la Corp : retour dans ${Math.round(GUIDE.missionExpressMs/1000)} secondes.`
    :`${etat.jimee.nom} est en route vers ${p.nom}. Retour prévu ${etat.params.test?'dans 30 secondes':`dans ${fmtDuree(dureeH)}`}.`);
  bruit('depart');
  const delai=express?Math.round(GUIDE.missionExpressMs/1000)+'s':etat.params.test?'30s':`${Math.round(dureeH*60)}m`;
  if(resultat.survie)programmerNtfy('Jimee de retour',`Mission terminée sur ${p.nom}. Le rapport vous attend à bord.`,delai,'rocket');
  else{
    const nb=objetsEquipes(etat.jimee).length;
    programmerNtfy('Votre Jimee ne repond plus',`Signal perdu sur ${p.nom}.${nb?` ${nb} équipement${nb>1?'s sont restés':' est resté'} sur la planète.`:''}`,delai,'warning');
  }
  sauver();tout();
}

// Création des équipements abandonnés à la mort (copie exacte des objets portés)
function abandonnerEquipement(j,m){
  const objets=objetsEquipes(j);
  if(!objets.length)return null;
  etat.compteurAbandon++;
  const ab={id:'AB'+String(etat.compteurAbandon).padStart(3,'0'),planeteId:m.planeteId,nomPlanete:m.nomPlanete,
    jimeeId:j.id,jimeeNom:j.nom,galaxie:etat.galaxieActuelle,nomGalaxie:galaxieCourante().nom,date:Date.now(),objets:objets.map(o=>({...o})),
    bonusBalise:(()=>{const b=effetUtil(j,'balise');return b?10+2*b.niveau:0})()};
  for(const s of SLOTS)j.equipement[s.id]=null;
  etat.abandons.push(ab);
  return ab;
}

function lancerRecuperation(abandonId,niveauAgence){
  const ab=etat.abandons.find(x=>x.id===abandonId), ag=agence(niveauAgence);
  if(!ab||!ag||!ab.objets.length)return;
  // Garde-fou : un abandon déjà confié à une agence ne peut jamais être retenté
  if(!RECUP.echecEquipeLaisseLesObjets&&!RECUP.nonTentesRestentSurPlace&&etat.recuperations.some(x=>x.abandonId===ab.id))return;
  if(recupsActives().length>=RECUP.maxSimultanees)return;
  if(niveauAgence===3&&rangCorp()<REPUTATION.agence3)return;
  const prix=prixAgence(ag,ab.objets);
  if(etat.credits<prix)return;
  etat.compteurRecup++;
  const maint=Date.now();
  const id='R'+String(etat.compteurRecup).padStart(3,'0');
  const seed=`RECUP|${ab.id}|${id}|${maint}`;
  const objets=ab.objets.map(o=>({...o}));
  const rec={id,abandonId:ab.id,planeteId:ab.planeteId,nomPlanete:ab.nomPlanete,jimeeId:ab.jimeeId,jimeeNom:ab.jimeeNom,
    niveauAgence,prix,objets,debut:maint,fin:maint+dureeRecup(),seed,statut:'en_cours',lu:false,
    resultat:resoudreRecuperation(objets,niveauAgence,seed,ab.bonusBalise||0)};   // résultat verrouillé dès maintenant
  // Les objets quittent la liste des abandons : ils sont « en cours de récupération », impossible de les envoyer deux fois.
  etat.abandons=etat.abandons.filter(x=>x.id!==ab.id);
  etat.credits-=prix;
  etat.recuperations.push(rec);
  dire(`Équipe « ${ag.nom} » envoyée sur ${ab.nomPlanete}. Facture : ${prix} crédits, non remboursables.`);
  const delai=etat.params.test?Math.round(RECUP.dureeTestMs/1000)+'s':Math.round(RECUP.dureeMs/60000)+'m';
  const res=rec.resultat;
  if(res.succes)programmerNtfy('Equipe de recuperation revenue',`${res.recupereIds.length} équipement${res.recupereIds.length>1?'s':''} récupéré${res.recupereIds.length>1?'s':''} sur ${ab.nomPlanete}.`,delai,'package');
  else programmerNtfy('Equipe de recuperation disparue',`L'équipe envoyée sur ${ab.nomPlanete} n'est pas revenue.`,delai,'x');
  sauver();tout();
}

function remettreSurPlace(rec,objets){
  if(rec.pillage)return;   // V17 : une épave d'ami n'est pas à nous, rien n'est « remis » chez nous
  if(!objets.length)return;
  let ab=etat.abandons.find(x=>x.id===rec.abandonId);
  if(!ab){ab={id:rec.abandonId,planeteId:rec.planeteId,nomPlanete:rec.nomPlanete,jimeeId:rec.jimeeId,jimeeNom:rec.jimeeNom,date:rec.debut,objets:[]};etat.abandons.push(ab)}
  ab.objets.push(...objets);
}
// Applique les récupérations arrivées à échéance. Idempotent : chaque récupération passe UNE fois de en_cours à terminee,
// et ce changement est sauvegardé dans la même opération que le transfert des objets.
function finaliserRecuperations(){
  let change=false;
  for(const rec of etat.recuperations){
    if(rec.statut!=='en_cours'||Date.now()<rec.fin)continue;
    const res=rec.resultat, parId=Object.fromEntries(rec.objets.map(o=>[o.id,o]));
    const inv=new Set(etat.inventaire.map(o=>o.id));
    for(const id of res.recupereIds)if(parId[id]&&!inv.has(id))etat.inventaire.push(parId[id]);
    if(!res.succes){if(RECUP.echecEquipeLaisseLesObjets)remettreSurPlace(rec,res.nonTenteIds.map(id=>parId[id]))}
    else if(RECUP.nonTentesRestentSurPlace)remettreSurPlace(rec,res.nonTenteIds.map(id=>parId[id]));
    rec.statut='terminee';
    change=true;
    if(res.succes){
      const n=res.recupereIds.length;
      notifier('🛟 L\'équipe de récupération est revenue',`📦 ${n} équipement${n>1?'s':''} récupéré${n>1?'s':''} sur ${rec.nomPlanete}.`);
      dire(`L'équipe de récupération est revenue de ${rec.nomPlanete} avec ${n} objet${n>1?'s':''}. Rapport disponible.`);
    } else {
      notifier('❌ L\'équipe de récupération n\'est pas revenue',`Aucun équipement récupéré sur ${rec.nomPlanete}.`);
      dire(`L'équipe envoyée sur ${rec.nomPlanete} ne répond plus. Rapport disponible.`);
    }
  }
  if(change){
    // On garde les récupérations en cours, celles non lues, et les 10 dernières lues
    const lues=etat.recuperations.filter(x=>x.statut==='terminee'&&x.lu);
    const aGarder=new Set(lues.slice(-10).map(x=>x.id));
    etat.recuperations=etat.recuperations.filter(x=>x.statut!=='terminee'||!x.lu||aGarder.has(x.id));
    sauver();
  }
  return change;
}

function laisserSurPlace(abandonId){
  const ab=etat.abandons.find(x=>x.id===abandonId);if(!ab)return;
  if(!confirm(`Abandonner définitivement ${ab.objets.length} objet${ab.objets.length>1?'s':''} sur ${ab.nomPlanete} ?`))return;
  etat.abandons=etat.abandons.filter(x=>x.id!==abandonId);
  dire(`Équipement de ${ab.jimeeNom} laissé sur ${ab.nomPlanete}. Les autochtones vous remercient.`);
  tout();
}

const restant=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h} h ${String(m).padStart(2,'0')}`:`${m} min ${String(ss).padStart(2,'0')} s`};

// Illustrations des planètes : un fichier par biome dans planetes/<id du biome>.webp (disque = 1/1,12 de l'image, halo autour).
// Le disque de couleur dessiné dessous sert de secours si l'image ne charge pas.
const ECHELLE_PLANETE=1.12;
// En attendant leurs illustrations, les nouveaux biomes réutilisent l'image d'un biome proche (supprimer la ligne quand l'image existe)
const IMAGE_SECOURS={ville:'metal',fongique:'jungle'};
const imagePlanete=b=>`planetes/${IMAGE_SECOURS[b.id]||b.id}.webp`;
function imagePlaneteSvg(p){
  const r=p.rayon*ECHELLE_PLANETE*1.12;
  return `<image href="${imagePlanete(p.biome)}" x="${p.x-r}" y="${p.y-r}" width="${2*r}" height="${2*r}" preserveAspectRatio="xMidYMid meet"/>`;
}
// V18 : dessin d'un astre central (galaxie : grand ; univers : cœur de la galaxie)
function astreSvg(id,x,y,r){const A=ASTRES[id]||ASTRES.etoile;
  if(id==='trou_noir')return `<g class="astre"><circle cx="${x}" cy="${y}" r="${r*2.1}" fill="${A.halo}" opacity=".35"/><ellipse cx="${x}" cy="${y}" rx="${r*1.9}" ry="${r*.55}" fill="none" stroke="#FFB067" stroke-width="${r*.28}" opacity=".9" transform="rotate(-18 ${x} ${y})"/><circle cx="${x}" cy="${y}" r="${r}" fill="#000" stroke="#FF9A4D" stroke-width="${r*.12}"/></g>`;
  if(id==='pulsar')return `<g class="astre"><path d="M${x-r*.3} ${y-r*3.2}L${x+r*.3} ${y-r*3.2}L${x+r*.08} ${y+r*3.2}L${x-r*.08} ${y+r*3.2}Z" fill="${A.halo}" transform="rotate(25 ${x} ${y})"/><circle cx="${x}" cy="${y}" r="${r*1.6}" fill="${A.halo}" opacity=".5"/><circle cx="${x}" cy="${y}" r="${r*.6}" fill="${A.couleur}"/></g>`;
  const f=id==='geante_bleue'?1.5:id==='naine_rouge'?.75:1;
  return `<g class="astre"><circle cx="${x}" cy="${y}" r="${r*f*2.2}" fill="${A.halo}" opacity=".35"/><circle cx="${x}" cy="${y}" r="${r*f*1.4}" fill="${A.halo}" opacity=".55"/><circle cx="${x}" cy="${y}" r="${r*f}" fill="${A.couleur}"/></g>`}
function dessinerCarteGalaxie(){
  const svg=$('#carte-svg');const m=etat.mission;
  let h='';
  if(m){const p=galaxie.planetes.find(x=>x.id===m.planeteId);if(p)h+=`<line x1="180" y1="180" x2="${p.x}" y2="${p.y}" stroke="var(--ia)" stroke-width="1.2" stroke-dasharray="4 4"/>`}
  h=astreSvg(galaxieCourante().astre,180,180,15)+h;
  if(etat.voyage)h+=`<text class="transit-carte" x="180" y="22">🚀 En transit vers ${(galaxieParId(etat.voyage.vers)||{}).nom}</text>`;
  // V17 : amis dans cette galaxie (mission en cours) et épaves d'amis
  for(const a of amis.filter(a=>a.galaxie===etat.galaxieActuelle&&a.mission&&a.mission.galaxie===etat.galaxieActuelle)){const p=galaxie.planetes.find(x=>x.id===a.mission.planeteId);
    if(p)h+=`<line x1="180" y1="180" x2="${p.x}" y2="${p.y}" stroke="#5BC489" stroke-width="1.2" stroke-dasharray="2 4"/><text class="ami-carte" x="${(180+p.x)/2}" y="${(180+p.y)/2-4}">${a.pseudo}</text>`}
  const epavesIci=epavesAmis.filter(e=>e.galaxie===etat.galaxieActuelle);
  h+=galaxie.planetes.map(p=>`<g class="planete${selection===p.id?' sel':''}" data-planete="${p.id}" tabindex="0" role="button" aria-label="${p.nom}, classe ${p.classe}">
    <circle cx="${p.x}" cy="${p.y}" r="${p.rayon*ECHELLE_PLANETE+12}" fill="transparent"/>
    ${selection===p.id?`<circle class="halo" cx="${p.x}" cy="${p.y}" r="${p.rayon*ECHELLE_PLANETE+5}"/>`:''}
    <circle cx="${p.x}" cy="${p.y}" r="${p.rayon*ECHELLE_PLANETE*.96}" fill="${p.biome.couleur}"/>
    ${imagePlaneteSvg(p)}
    <text x="${p.x}" y="${p.y+p.rayon*ECHELLE_PLANETE+13}">${p.nom} · ${p.classe}</text>
    ${p.speciale&&etat.bossVus[cleGal()]?(()=>{const bx=p.x-p.rayon*ECHELLE_PLANETE*.85,by=p.y-p.rayon*ECHELLE_PLANETE*.85,mort=etat.bossVus[cleGal()]==='vaincu';
      return `<g class="boss-marque"><circle cx="${bx}" cy="${by}" r="7.5" fill="${mort?'#55608f':'#FF8A3D'}" stroke="#121833" stroke-width="1.5"/><text x="${bx}" y="${by+4.5}" fill="#121833">${mort?'☠':'★'}</text></g>`})():''}
    ${epavesIci.some(e=>e.planete_id===p.id)?(()=>{const ex=p.x+p.rayon*ECHELLE_PLANETE*.85,ey=p.y-p.rayon*ECHELLE_PLANETE*.85;return `<g class="epave-marque"><circle cx="${ex}" cy="${ey}" r="6" fill="#E8A24A" stroke="#121833" stroke-width="1.5"/><path d="M${ex-2.6} ${ey-2.6}L${ex+2.6} ${ey+2.6}M${ex+2.6} ${ey-2.6}L${ex-2.6} ${ey+2.6}" stroke="#121833" stroke-width="1.6" stroke-linecap="round"/></g>`})():''}</g>`).join('');
  svg.innerHTML=h;
}

/* ---------- Carte stellaire : vue galaxie (planètes) ou vue univers (galaxies), avec zoom ---------- */
let carteVue='galaxie', selectionGalaxie=null, vueU=null;   // vueU = {cx, cy, rayon} en kAL
const ZOOM_MIN=60;
const vueUniversParDefaut=()=>{const g=galaxieCourante();return {cx:g.x,cy:g.y,rayon:Math.max(140,porteeScanner()*1.35)}};
function bornerVue(){
  const R=UNIVERS.rayon;
  vueU.rayon=Math.max(ZOOM_MIN,Math.min(R*1.15,vueU.rayon));
  const d=Math.hypot(vueU.cx,vueU.cy);if(d>R){vueU.cx*=R/d;vueU.cy*=R/d}
}
function dessinerCarte(){
  const svg=$('#carte-svg');
  svg.classList.toggle('vue-univers',carteVue==='univers');
  document.querySelectorAll('[data-vue]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.vue===carteVue));
  $('#zoom-outils').style.display=carteVue==='univers'?'flex':'none';
  if(carteVue==='univers')dessinerUnivers();
  else{svg.setAttribute('viewBox','0 0 360 360');dessinerCarteGalaxie()}
}
function dessinerUnivers(){
  const svg=$('#carte-svg');if(!vueU)vueU=vueUniversParDefaut();bornerVue();
  const {cx,cy,rayon}=vueU, u=rayon/180, R=UNIVERS.rayon, cur=galaxieCourante(), portee=porteeScanner();
  svg.setAttribute('viewBox',`${cx-rayon} ${cy-rayon} ${2*rayon} ${2*rayon}`);
  let h=`<circle cx="0" cy="0" r="${R}" fill="none" stroke="#6E79B0" stroke-width="${u}" stroke-dasharray="${5*u} ${5*u}" opacity=".7"/>
    <text class="u-legende" x="0" y="${-R-7*u}" font-size="${9*u}">Limite de l'univers connu</text>
    <circle cx="${cur.x}" cy="${cur.y}" r="${portee*SIGNAL_FAIBLE}" fill="none" stroke="#6E79B0" stroke-width="${.6*u}" stroke-dasharray="${2*u} ${4*u}" opacity=".5"/>
    <circle cx="${cur.x}" cy="${cur.y}" r="${portee}" fill="rgba(242,193,78,.06)" stroke="var(--ia)" stroke-width="${u}" stroke-dasharray="${3*u} ${3*u}"/>
    <text class="u-legende scan" x="${cur.x}" y="${cur.y-portee-5*u}" font-size="${8.5*u}">Portée du scanner : ${portee} kAL</text>`;
  const sel=selectionGalaxie&&galaxieParId(selectionGalaxie);
  if(sel&&sel.id!==cur.id&&visibilite(sel)){
    // étiquette du trajet décalée perpendiculairement au trait, pour ne pas chevaucher les noms
    const ok=!raisonVoyageImpossible(sel), L=Math.hypot(sel.x-cur.x,sel.y-cur.y)||1, nx=-(sel.y-cur.y)/L, ny=(sel.x-cur.x)/L;
    const mx=(cur.x+sel.x)/2+nx*12*u, my=(cur.y+sel.y)/2+ny*12*u;
    h+=`<line x1="${cur.x}" y1="${cur.y}" x2="${sel.x}" y2="${sel.y}" stroke="${ok?'var(--ia)':'var(--mauvais)'}" stroke-width="${1.2*u}" stroke-dasharray="${4*u} ${3*u}"/>`;
    if(visibilite(sel)==='connue')h+=`<text class="u-legende trajet" x="${mx}" y="${my}" font-size="${9*u}">${distanceGal(cur,sel)} kAL · ${carburantNecessaire(cur,sel)} carb.</text>`;
  }
  for(const g of univers.galaxies){
    const v=visibilite(g);if(!v)continue;
    const estSel=g.id===selectionGalaxie, estCur=g.id===cur.id;
    if(v==='faible'){
      const s=Math.max(3,3*u);
      h+=`<g class="galaxie faible${estSel?' sel':''}" data-galaxie="${g.id}" role="button" tabindex="0" aria-label="Signal non identifié">
        <circle cx="${g.x}" cy="${g.y}" r="${s*4}" fill="transparent"/>
        <circle cx="${g.x}" cy="${g.y}" r="${s}" fill="#8890B8" opacity=".6"/>
        ${rayon<=220?`<text x="${g.x}" y="${g.y+s+9*u}" font-size="${8*u}">?</text>`:''}
        ${estSel?`<circle class="halo" cx="${g.x}" cy="${g.y}" r="${s*2.5}" stroke-width="${u}"/>`:''}</g>`;
      continue;
    }
    const t=TYPES_GALAXIE[g.type], s=Math.max(g.taille,5*u), info=infoGalaxie(g);
    h+=`<g class="galaxie${estSel?' sel':''}" data-galaxie="${g.id}" role="button" tabindex="0" aria-label="${g.nom}, galaxie ${t.nom.toLowerCase()}, planètes ${etiquetteClasses(info)}">
      <circle cx="${g.x}" cy="${g.y}" r="${s*1.9}" fill="transparent"/>
      <ellipse cx="${g.x}" cy="${g.y}" rx="${s}" ry="${s*.42}" transform="rotate(${g.angle} ${g.x} ${g.y})" fill="${t.couleur}" opacity=".5"/>
      <ellipse cx="${g.x}" cy="${g.y}" rx="${s*.55}" ry="${s*.24}" transform="rotate(${g.angle} ${g.x} ${g.y})" fill="${t.couleur}" opacity=".8"/>
      ${astreSvg(g.astre,g.x,g.y,s*.2)}
      ${estCur?`<circle cx="${g.x}" cy="${g.y}" r="${s*1.35}" fill="none" stroke="var(--ia)" stroke-width="${1.4*u}"/>`:''}
      ${estSel?`<circle class="halo" cx="${g.x}" cy="${g.y}" r="${s*1.6}" stroke-width="${u}"/>`:''}
      ${rayon<=220||estCur||estSel?`<text x="${g.x}" y="${g.y+s+10*u}" font-size="${9*u}">${estCur?'▲ ':''}${g.nom} · ${etiquetteClasses(info)}</text>`:''}</g>`;
  }
  // V17 : amis (affichés même hors de portée du scanner : contact radio)
  amis.forEach((a,i)=>{const g=galaxieParId(a.galaxie);if(!g)return;const s=Math.max(g.taille||6,5*u),dx=s*1.5+i*6*u;
    h+=`<g class="ami-univers${enLigne(a)?'':' hors-ligne'}"><circle cx="${g.x+dx}" cy="${g.y-s}" r="${4*u}" fill="#5BC489" stroke="#0b1236" stroke-width="${u}"/>
      <text x="${g.x+dx}" y="${g.y-s-6*u}" font-size="${8.5*u}">${a.pseudo}${a.jimee&&a.jimee.voyage?' · en voyage':a.mission?' · en mission':''}</text></g>`});
  for(const e of epavesAmis){const g=galaxieParId(e.galaxie);if(!g)continue;const s=Math.max(g.taille||6,5*u);h+=`<text class="epave-carte" x="${g.x-s*1.4}" y="${g.y-s*.6}" font-size="${10*u}">✝</text>`}
  svg.innerHTML=h;
}

function panneauGalaxieCourante(){
  const g=galaxieCourante(), i=infoGalaxie(g);
  return `<p class="sous">Galaxie ${g.nom} · ${TYPES_GALAXIE[g.type].nom.toLowerCase()} · ${i.nb} planètes (${etiquetteClasses(i)})</p>`;
}
// V18 : ce que le joueur sait d'une galaxie (jamais plus que ce qu'il a découvert)
const cleCartoG=(gid,pid)=>etat.params.galaxie+'/'+gid+'/'+pid;
function progressionGalaxie(g){
  const gal=chargerGalaxie(g),M=EPREUVES.cartographie.missions,n=gal.planetes.length;
  const ex=gal.planetes.filter(p=>(etat.cartographie[cleCartoG(g.id,p.id)]||0)>0).length,comp=gal.planetes.filter(p=>(etat.cartographie[cleCartoG(g.id,p.id)]||0)>=M).length;
  return {n,ex,comp,inconnues:n-ex,gardien:etat.gardiensVaincus.includes(g.id),
    epaves:etat.abandons.filter(a=>(a.galaxie||'G0')===g.id).length,epavesAmis:(typeof epavesAmis!=='undefined'?epavesAmis:[]).filter(e=>e.galaxie===g.id).length,
    amis:(typeof amis!=='undefined'?amis:[]).filter(a=>a.galaxie===g.id).map(a=>a.pseudo)};
}
function blocProgression(g){
  const vis=etat.galaxiesVisitees.includes(g.id),A=ASTRES[g.astre]||ASTRES.etoile,P=progressionGalaxie(g);
  let h=`<div class="ligne"><span>Astre central</span><span>${A.nom}</span></div><p class="note">${A.desc}</p>`;
  if(!vis)return h+`<div class="ligne"><span>Exploration</span><span>jamais visitée</span></div>${P.amis.length?`<p class="note">📡 ${P.amis.join(', ')} ${P.amis.length>1?'s\'y trouvent':'s\'y trouve'}.</p>`:''}${P.epavesAmis?`<p class="note">✝ ${P.epavesAmis} épave${P.epavesAmis>1?'s':''} d'ami signalée${P.epavesAmis>1?'s':''}.</p>`:''}`;
  return h+`<div class="ligne"><span>Planètes explorées</span><span>${P.ex} / ${P.n}${P.inconnues?` · ${P.inconnues} inconnue${P.inconnues>1?'s':''}`:''}</span></div>
    <div class="stat"><span>Progression</span><span class="jauge"><i style="width:${P.n?Math.round(P.ex/P.n*100):0}%"></i></span><span>${P.n?Math.round(P.ex/P.n*100):0} %</span></div>
    <div class="ligne"><span>Cartographie complète</span><span>${P.comp} / ${P.n}</span></div>
    <div class="ligne"><span>Gardien légendaire</span><span>${P.gardien?'vaincu':'pas encore'}</span></div>
    ${P.epaves?`<div class="ligne"><span>Vos épaves</span><span>${P.epaves}</span></div>`:''}${P.epavesAmis?`<div class="ligne"><span>Épaves d'amis</span><span>${P.epavesAmis}</span></div>`:''}
    ${P.amis.length?`<p class="note">📡 ${P.amis.join(', ')} ${P.amis.length>1?'s\'y trouvent':'s\'y trouve'}.</p>`:''}`;
}
// V23 : vue univers au même format que la vue galaxie — bandeau court sur la carte, fiche plein écran au toucher
function panneauUnivers(){
  const cur=galaxieCourante(), v=etat.vaisseau, cap=reservoir().capacite;
  const nbVisibles=univers.galaxies.filter(x=>visibilite(x)==='connue').length-1, nbFaibles=univers.galaxies.filter(x=>visibilite(x)==='faible').length;
  const g=selectionGalaxie&&galaxieParId(selectionGalaxie);
  if(!g)return `<p class="sous">Univers · vous êtes dans ${cur.nom} ▲ · ${nbVisibles} galaxie${nbVisibles>1?'s':''} à portée${nbFaibles?` · ${nbFaibles} signa${nbFaibles>1?'ux':'l'} ?`:''}</p>
    <p class="vide">Touchez une galaxie pour voir sa fiche, ou la vôtre (▲) pour son bilan.</p>`;
  const vaisseau=`<p>Carburant : ${v.carburant} / ${cap}</p><p>Portée d'un saut : ${porteeMaxKAL()} kAL (réservoir niveau ${reservoir().niveau})</p><p>Scanner niveau ${scanner().niveau} : ${porteeScanner()} kAL</p><p>${etat.galaxiesVisitees.length} galaxie${etat.galaxiesVisitees.length>1?'s':''} visitée${etat.galaxiesVisitees.length>1?'s':''}</p>`;
  const A=ASTRES[g.astre]||ASTRES.etoile, P=progressionGalaxie(g), vis=etat.galaxiesVisitees.includes(g.id);
  const explo=vis?`${P.ex} / ${P.n} explorées`:'jamais visitée';
  if(g.id===cur.id){
    const i=infoGalaxie(cur);
    return `<h2>${cur.nom}</h2><p class="sous">Votre position · galaxie ${TYPES_GALAXIE[cur.type].nom.toLowerCase()} · ${A.nom.toLowerCase()}</p>
      <div class="resume-chiffres"><span>Planètes <b>${i.nb}</b> ${etiquetteClasses(i)}</span><span>Explorées <b>${P.ex}</b>/${P.n}</span><span>Carburant <b>${v.carburant}</b>/${cap}</span></div>
      ${repli('Exploration de la galaxie',blocProgression(cur),explo,true)}
      ${repli('Alentours',`<p>Galaxies identifiées à portée : ${nbVisibles}</p><p>Signaux non identifiés : ${nbFaibles}</p><p>Distance du point de départ : ${Math.round(Math.hypot(cur.x,cur.y))} kAL</p>`,`${nbVisibles} à portée`)}
      ${repli('Vaisseau',vaisseau,`scanner ${porteeScanner()} kAL`)}
      <p class="aide">Glissez pour vous déplacer, pincez ou + / − pour zoomer. Les galaxies hors de portée du scanner n'apparaissent pas.</p>`;
  }
  const d=distanceGal(cur,g);
  if(visibilite(g)==='faible'){
    const requis=SCANNERS.find(s=>s.portee>=d);
    return `<h2>Signal non identifié</h2><p class="sous">Objet détecté, impossible à identifier</p>
      <div class="resume-chiffres"><span>Distance <b>≈ ${Math.round(d/10)*10}</b> kAL</span><span>Scanner <b>niv. ${scanner().niveau}</b></span>${requis?`<span>Il faut <b>niv. ${requis.niveau}</b></span>`:''}</div>
      <p class="note">Pas de trajectoire possible tant que le signal n'est pas identifié.${requis?` Un scanner niveau ${requis.niveau} (portée ${requis.portee} kAL) suffirait, au hangar.`:''}</p>
      <p class="aide">« Probablement une galaxie. Ou une tache sur l'objectif. » — Service technique Jimee's Corp</p>`;
  }
  const i=infoGalaxie(g), besoin=carburantNecessaire(cur,g), raison=raisonVoyageImpossible(g), duree=fmtDuree(dureeVoyageMin(d)/60);
  const ordre=ORDRE_CLASSES.filter(c=>i.compte[c]).map(c=>`${i.compte[c]} ${c}`).join(', ');
  const manqueCarbu=besoin>v.carburant;
  return `<h2>${g.nom}</h2><p class="sous">Galaxie ${TYPES_GALAXIE[g.type].nom.toLowerCase()} · ${A.nom.toLowerCase()}${vis?' · déjà visitée':''}</p>
    <div class="resume-chiffres"><span>Distance <b>${d}</b> kAL</span><span>Voyage <b>${duree}</b></span><span>Carburant <b${manqueCarbu?' style="color:var(--mauvais)"':''}>${besoin}</b>/${v.carburant}</span><span>Danger moy. <b>${i.dangerMoyen}</b>/100</span></div>
    ${repli('Planètes (relevé du scanner)',`<p>${i.nb} planètes : ${ordre}</p><p>Dangerosité moyenne : ${i.dangerMoyen} / 100</p>`,`${i.nb} · ${etiquetteClasses(i)}`)}
    ${repli('Exploration',blocProgression(g),explo)}
    ${repli('Trajet',`<div class="ligne"><span>Durée du voyage</span><span>${duree}${etat.params.test?' (20 s en mode test)':''}</span></div><div class="ligne"><span>Carburant nécessaire</span><span>${besoin} (${CARBURANT.conso.fixe} + ${CARBURANT.conso.parKAL} × ${d} kAL)</span></div><div class="ligne"><span>Réservoir après le saut</span><span>${Math.max(0,v.carburant-besoin)} / ${cap}</span></div>${d>porteeMaxKAL()?'<p>Hors de portée du réservoir actuel.</p>':''}`,`${besoin} carb.`)}
    <button class="btn" data-action="voyager" data-galaxie-cible="${g.id}" ${raison?'disabled':''}>Partir vers ${g.nom} · ${duree}</button>
    ${raison?`<p class="note">${raison}</p>`:`<p class="note">Pendant le voyage, aucune mission ni escouade ne peut partir.</p><p class="aide">Plus une galaxie est loin du centre, plus ses planètes sont souvent dangereuses… et riches. Souvent, pas toujours.</p>`}`;
}
function panneauCarte(){
  if(carteVue==='univers')return panneauUnivers();
  return panneauGalaxieCourante()+panneauPlanete();
}

/* Glisser pour se déplacer, pincer / molette pour zoomer (vue univers uniquement) */
const pointeurs=new Map();let geste=null, aGlisse=false, rafCarte=0;
function redessinerUniversBientot(){if(!rafCarte)rafCarte=requestAnimationFrame(()=>{rafCarte=0;dessinerUnivers()})}
function initGestesCarte(){
  const svg=$('#carte-svg');
  const debut=()=>{const pts=[...pointeurs.values()];geste={vue:{...vueU},pts:pts.map(p=>({...p})),
    ecart:pts.length>1?Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y):0}};
  svg.addEventListener('pointerdown',e=>{if(carteVue!=='univers')return;pointeurs.set(e.pointerId,{x:e.clientX,y:e.clientY});aGlisse=false;debut()});
  svg.addEventListener('pointermove',e=>{
    if(carteVue!=='univers'||!pointeurs.has(e.pointerId)||!geste)return;
    pointeurs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pts=[...pointeurs.values()], k=(2*geste.vue.rayon)/(svg.clientWidth||360);
    if(pts.length===1){
      const dx=pts[0].x-geste.pts[0].x, dy=pts[0].y-geste.pts[0].y;
      if(Math.hypot(dx,dy)>6)aGlisse=true;
      if(aGlisse){vueU.cx=geste.vue.cx-dx*k;vueU.cy=geste.vue.cy-dy*k;redessinerUniversBientot()}
    } else if(pts.length===2&&geste.ecart){
      aGlisse=true;
      vueU.rayon=geste.vue.rayon*geste.ecart/Math.max(10,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
      redessinerUniversBientot();
    }
  });
  const fin=e=>{pointeurs.delete(e.pointerId);if(pointeurs.size)debut();else geste=null};
  svg.addEventListener('pointerup',fin);svg.addEventListener('pointercancel',fin);svg.addEventListener('pointerleave',fin);
  svg.addEventListener('wheel',e=>{if(carteVue!=='univers')return;e.preventDefault();vueU.rayon*=e.deltaY>0?1.15:1/1.15;redessinerUniversBientot()},{passive:false});
}
function zoomer(action){
  if(!vueU)vueU=vueUniversParDefaut();
  if(action==='plus')vueU.rayon/=1.4;
  else if(action==='moins')vueU.rayon*=1.4;
  else if(action==='tout')vueU={cx:0,cy:0,rayon:UNIVERS.rayon*1.12};
  else if(action==='moi')vueU=vueUniversParDefaut();
  dessinerUnivers();
}

// Achat de carburant (affiché dans la fiche Réservoir du hangar)
function blocCarburant(){
  const v=etat.vaisseau, cap=reservoir().capacite, manque=cap-v.carburant;
  const prixQ=q=>BOUTIQUE_TEST.carburantGratuit?0:q*CARBURANT.prixUnite;
  const etiquettePrix=p=>p?`${p} cr`:'gratuit';
  const bouton=q=>{const qq=Math.min(q,manque);return `<button class="btn sec" data-action="carburant" data-qte="${q}" ${qq<=0||etat.credits<prixQ(qq)?'disabled':''}>+${qq>0?qq:q} (${etiquettePrix(prixQ(Math.max(0,qq)))})</button>`};
  return `<h4 class="titre-carbu">Carburant</h4>
    <div class="stat"><span>Réservoir</span><span class="jauge"><i style="width:${v.carburant/cap*100}%;background:var(--ia)"></i></span><span>${v.carburant}</span></div>
    <p class="note">${v.carburant} / ${cap} unités. Prix : ${BOUTIQUE_TEST.carburantGratuit?`gratuit pendant la phase de test (${CARBURANT.prixUnite} cr / unité ensuite)`:`${CARBURANT.prixUnite} cr / unité`}. Livraison en orbite instantanée, odeur de kérosène offerte.</p>
    <div class="achats">${CARBURANT.achatsRapides.map(bouton).join('')}<button class="btn" data-action="carburant" data-qte="${cap}" ${manque<=0||etat.credits<prixQ(manque)?'disabled':''}>Faire le plein (${manque>0?etiquettePrix(prixQ(manque)):'déjà plein'})</button></div>
`;
}

// Cadrage de l'image du vaisseau (1024 × 1536).
// Les éléments cliquables occupent la ZONE ci-dessous (en fraction de l'image). On agrandit l'image autant que possible
// (comme object-fit:cover) SANS jamais couper cette zone ; s'il reste de la place, elle est comblée par une copie floutée
// de l'image (jamais de bande noire). L'image est calée en bas : la place libre se retrouve en haut, sous le bandeau.
const IMG_VAISSEAU_W=1024, IMG_VAISSEAU_H=1536;
const ZONE_VAISSEAU={x0:.06,x1:.94,y0:.26,y1:.92};   // V2 : étiquettes du haut + barre Hangar / Atelier / Commerce
function cadrageVaisseau(cw,ch){return cadrageImage(IMG_VAISSEAU_W,IMG_VAISSEAU_H,ZONE_VAISSEAU,cw,ch,.18)}
// margeHaut : fraction de l'écran que le haut de la zone importante ne doit pas franchir (bandeau en surimpression)
function cadrageImage(W,H,Z,cw,ch,margeHaut){
  const contain=Math.min(cw/W,ch/H), cover=Math.max(cw/W,ch/H);
  const zoneTientEnLargeur=cw/(W*(Z.x1-Z.x0));
  const zoneTientEnHauteur=(ch*.82)/(H*(Z.y1-Z.y0));
  const echelle=Math.max(contain,Math.min(cover,zoneTientEnLargeur,zoneTientEnHauteur));
  const dW=W*echelle,dH=H*echelle;
  // horizontal : centré sur la zone, sans laisser de vide si l'image déborde
  let x=cw/2-((Z.x0+Z.x1)/2)*dW;
  x=dW>=cw?Math.min(0,Math.max(cw-dW,x)):(cw-dW)/2;
  // vertical : calé en bas, mais le haut de la zone reste sous le bandeau (18 % de l'écran)
  let y=ch-dH;
  if(y+Z.y0*dH<ch*margeHaut)y=ch*margeHaut-Z.y0*dH;
  if(dH>=ch)y=Math.min(0,Math.max(ch-dH,y));
  return {x,y,dW,dH};
}
// V15 : baie d'observation. Les étoiles sont tirées une fois (graine fixe) en ombres portées, dédoublées pour défiler en boucle.
function initBaie(){
  const r=creerRng('BAIE');
  const couche=(n,taille,alpha)=>{const pts=[];for(let i=0;i<n;i++){const x=r.int(0,519),y=r.int(0,520),a=(alpha*(.6+r.f()*.4)).toFixed(2),c=r.chance(.15)?'247,213,139':r.chance(.1)?'233,169,58':'255,247,228';   // V24 : étoiles crème et moutarde
    for(const dx of [0,520])pts.push(`${x+dx}px ${y}px 0 ${taille}px rgba(${c},${a})`)}return pts.join(',')};
  const set=(sel,v)=>{const el=document.querySelector(sel);if(el){el.style.boxShadow=v;el.dataset.n=v.split('),').length}};
  set('.baie .e1',couche(150,0,.55));set('.baie .e2',couche(60,.5,.8));set('.baie .e3',couche(22,1,1));
}
// La baie n'occupe que la bande libre au-dessus de l'image : planète et lune y sont placées en proportion
function positionnerBaie(cont){
  const img=cont.querySelector('img'),libre=parseFloat(img.style.top)||0,cw=cont.clientWidth;
  cont.classList.toggle('avec-baie',libre>24);
  const haut=libre+0.055*parseFloat(img.style.height||0);   // jusqu'où la baie reste visible (fondu compris)
  const pl=cont.querySelector('.planete-baie'),lu=cont.querySelector('.lune-baie');if(!pl)return;
  const d=Math.max(56,Math.min(cw*.34,libre*.6));
  Object.assign(pl.style,{width:d+'px',height:d+'px',right:(cw*.08)+'px',top:Math.max(libre*.36,libre-d*.8)+'px'});
  const dl=d*.17;Object.assign(lu.style,{width:dl+'px',height:dl+'px',left:(cw*.18)+'px',top:Math.max(78,libre*.5)+'px'});
}
function positionnerHotspots(){const c=$('#ecran-vaisseau');poserImage(c,cadrageVaisseau);positionnerBaie(c)}
function positionnerHangar(){poserImage($('#ecran-hangar'),(cw,ch)=>cadrageImage(IMG_HANGAR_W,IMG_HANGAR_H,ZONE_HANGAR,cw,ch,.07))}
function poserImage(conteneur,cadrage){
  const cw=conteneur.clientWidth, ch=conteneur.clientHeight;
  if(!cw||!ch)return;
  const {x:decalX,y:decalY,dW,dH}=cadrage(cw,ch);
  const img=conteneur.querySelector('img');
  Object.assign(img.style,{left:decalX+'px',top:decalY+'px',width:dW+'px',height:dH+'px'});
  conteneur.querySelectorAll('.hotspot-img').forEach(el=>{
    el.style.left=(decalX+(+el.dataset.hx/100)*dW)+'px'; el.style.top=(decalY+(+el.dataset.hy/100)*dH)+'px';
    el.style.width=((+el.dataset.hw/100)*dW)+'px'; el.style.height=((+el.dataset.hh/100)*dH)+'px';
  });
}

function dessinerEcran(){
  const divs={vaisseau:$('#ecran-vaisseau'),carte:$('#ecran-carte'),panneau:$('#ecran-panneau'),hangar:$('#ecran-hangar')};
  const cible=['carte','vaisseau','hangar'].includes(ecran)?ecran:'panneau';
  for(const k in divs)divs[k].style.display=(k===cible)?'flex':'none';
  document.body.classList.toggle('mode-vaisseau',cible==='vaisseau');
  document.body.classList.toggle('mode-carte',cible==='carte');
  document.body.classList.toggle('mode-marche',ecran==='marche');
  document.body.classList.toggle('mode-atelier',ecran==='atelier');
  if(cible==='vaisseau'){
    majSoute();
    const j=etat.jimee, enMission=!!etat.mission;
    $('#hotspot-jimee').setAttribute('aria-label', !j?"Poste vacant : aller recruter un Jimee":enMission?`${j.nom} est en mission`:`${j.nom} : voir ses stats`);
    // V24 : avec les décors cartoon, la banquette est vide sur l'image : le jeu y dessine le Jimee à bord (absent en mission)
    if(DECORS.cartoon){const cle=j&&!enMission?j.id+'/'+j.classe:'';const h=$('#hotspot-jimee');
      if(h.dataset.perso!==cle){h.dataset.perso=cle;h.innerHTML=cle?`<span class="jimee-banquette">${dessinJimee(classeDuJimee(j),'heureux')}</span>`:''}}
    positionnerHotspots();
  } else if(cible==='carte'){
    // V20 : fiche ouverte = une planète (vue galaxie) ou une galaxie autre que la nôtre (vue univers)
    const fiche=carteVue==='galaxie'?!!selection:!!selectionGalaxie;   // V23 : sa propre galaxie a aussi sa fiche plein écran
    const el=$('#ecran-carte');el.classList.add('carte-pleine');el.classList.toggle('fiche-ouverte',fiche);
    const ret=$('#retour-carte');
    if(fiche){ret.textContent=carteVue==='galaxie'?'‹ Galaxie':'‹ Univers';ret.dataset.retourCarte='1';delete ret.dataset.retourVaisseau}
    else{ret.textContent='‹ Vaisseau';ret.dataset.retourVaisseau='1';delete ret.dataset.retourCarte}
    if(!fiche)dessinerCarte();
    $('#panneau-carte').innerHTML=panneauCarte();
  } else if(cible==='hangar'){
    const el=$('#ecran-hangar');el.classList.toggle('fiche-ouverte',!!hangarSel);
    const ret=el.querySelector('.retour-flottant');
    if(hangarSel){ret.textContent='‹ Hangar';ret.dataset.retourHangar='1';delete ret.dataset.retourVaisseau}
    else{ret.textContent='‹ Vaisseau';ret.dataset.retourVaisseau='1';delete ret.dataset.retourHangar}
    $('#hangar-zones').innerHTML=zonesHangar();
    $('#hangar-fiche').innerHTML=ficheHangar();
    $('#hangar-fiche').classList.toggle('ouverte',!!hangarSel);
    if(!hangarSel)positionnerHangar();
  } else {
    const html=ecran==='jimee'?panneauJimee(jimeeStatsSeules):ecran==='corp'?panneauCorp():ecran==='marche'?panneauMarche():ecran==='atelier'?panneauAtelier():panneauLabo();
    $('#panneau').innerHTML=html;
  }
}

    blocs.push(`<div><strong>🚀 Voyage en cours vers ${g?g.nom:'?'}</strong> · ${v.distance} kAL · durée ${fmtDuree(tot/3600000)} · arrivée dans ${restant(v.fin-Date.now())}<div class="barre"><i style="width:${Math.min(100,ec/tot*100).toFixed(1)}%"></i></div></div>`)}

  }

   if(xa.length||xl.length)blocs.push(`<div>${xa.map(x=>`<p class="recup-ligne">📦 Escouade ${x.id} sur ${x.nomPlanete} · retour dans ${restant(x.fin-Date.now())}</p>`).join('')}

// V13 : stock d'équipements, révélé seulement quand la cartographie est complète
function ligneStockEquipements(p){
  const n=etat.cartographie[cleCarto(p)]||0,M=EPREUVES.cartographie.missions;
  if(n<M)return `<div class="ligne"><span>Équipements à trouver</span><span>inconnus (cartographie ${n} / ${M})</span></div>`;
  const total=p.stockEquipements||0,reste=stockRestant(p);
  if(!total)return `<div class="ligne"><span>Équipements à trouver</span><span>aucun</span></div><p class="note">« Aucun équipement sur cette planète. Merci pour ce relevé d'une utilité remarquable. » — Service cartographie Jimee's Corp</p>`;
  if(!reste)return `<div class="ligne"><span>Équipements à trouver</span><span>tous récupérés (${total} / ${total})</span></div><p class="note">« Planète entièrement vidée. Les habitants vous remercient de ne plus revenir. » — Service cartographie Jimee's Corp</p>`;
  return `<div class="ligne"><span>Équipements à trouver</span><span>${reste} restant${reste>1?'s':''} sur ${total}</span></div>`;
}
